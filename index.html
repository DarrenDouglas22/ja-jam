// ============================================================ leaderboard (Supabase)
const SCORE_CAP = 999; // leaderboard score = session run total across games (arcade 3 digits)
const CONFIG = {
  SUPABASE_URL: '',      // e.g. 'https://xxxx.supabase.co'
  SUPABASE_ANON_KEY: '', // anon public key (safe to ship client-side; RLS enforces rules)
};

const Leaderboard = (() => {
  const live = !!(CONFIG.SUPABASE_URL && CONFIG.SUPABASE_ANON_KEY && window.supabase);
  const client = live ? window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY) : null;
  // in-memory mock so the UI runs before the backend is wired (deliberately not localStorage)
  const mock = [
    { id: 'm1', name: 'BUD', score: 21, created_at: '2026-07-01T00:00:00Z' },
    { id: 'm2', name: 'JAM', score: 15, created_at: '2026-07-01T00:01:00Z' },
    { id: 'm3', name: 'BAH', score: 9,  created_at: '2026-07-01T00:02:00Z' },
  ];
  const valid = (name, score) =>
    /^[A-Z0-9]{1,3}$/.test(name) && Number.isInteger(score) && score >= 0 && score <= SCORE_CAP;

  async function submitScore(name, score) {
    if (!valid(name, score)) return { error: 'invalid score or initials' };
    if (!live) {
      const row = { id: 'm' + Math.random().toString(36).slice(2), name, score, created_at: new Date().toISOString() };
      mock.push(row);
      return { row };
    }
    try {
      const { data, error } = await client.from('scores').insert({ name, score }).select().single();
      return error ? { error: error.message } : { row: data };
    } catch (e) { return { error: String(e) }; }
  }

  async function fetchTopScores(limit = 10) {
    if (!live) {
      const rows = mock.slice()
        .sort((a, b) => b.score - a.score || a.created_at.localeCompare(b.created_at))
        .slice(0, limit);
      return { rows };
    }
    try {
      const { data, error } = await client.from('scores')
        .select('id,name,score,created_at')
        .order('score', { ascending: false })
        .order('created_at', { ascending: true })
        .limit(limit);
      return error ? { error: error.message } : { rows: data };
    } catch (e) { return { error: String(e) }; }
  }

  return { submitScore, fetchTopScores, isLive: live };
})();

// Players are drawn as smooth vector cartoons every frame — big heads, shaded
// limbs, outlined shapes (Basket Bros / NBA Jam energy, not pixel art).
// A "look" is derived per game: team decides the kit, the name decides the face.

function nameHash(s) {
  let h = 0;
  for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0;
  return Math.abs(h);
}
function faceFor(name) {
  const h = nameHash(name);
  return { eyes: h % 3, brows: ((h / 3) | 0) % 3, mouth: ((h / 9) | 0) % 3, num: h % 100 };
}
const JAM_SKINS = ['#5C3317', '#8D5524', '#6E4023'];
const JAM_HAIR = ['locs', 'fade', 'hitop'];

function shade(col, f) { // lighten (f>0) or darken (f<0) a #rrggbb or rgb() color
  let n;
  if (col[0] === '#') n = parseInt(col.slice(1), 16);
  else {
    const m = col.match(/(\d+)\D+(\d+)\D+(\d+)/);
    n = (+m[1] << 16) | (+m[2] << 8) | +m[3];
  }
  const ch = i => {
    let v = (n >> (16 - 8 * i)) & 255;
    v = f > 0 ? v + (255 - v) * f : v * (1 + f);
    return Math.round(Math.max(0, Math.min(255, v)));
  };
  return 'rgb(' + ch(0) + ',' + ch(1) + ',' + ch(2) + ')';
}

let lastOppIdx = -1;

function setOpponent(t) {

function pickArcadeOpponent() { // random rotation, never the same team twice in a row
  let i;
  do { i = (Math.random() * ROSTER.length) | 0; } while (ROSTER.length > 1 && i === lastOppIdx);

  setOpponent(ROSTER[i]);
}

  shootT: 0, jumpT: 0, runT: 0, // animation timers
  dunk: null, // in-flight dunk state
}));

const ball = {
  mode: 'loose', // loose | held | flight
  x: CX, y: FLOOR - 11, vx: 0, vy: 0,
  holder: null, flight: null,
};

const standY = p => FLOOR - p.h / 2;

function resetPlayerState(p) {
  p.vx = 0; p.vy = 0; p.streak = 0; p.fireShots = 0; p.stealCd = 0;
  p.fx = p.team === 0 ? 1 : -1; p.grounded = true;
  p.shootT = 0; p.jumpT = 0; p.runT = 0;
  p.dunk = null;
}

function tipOff() {
  players[0].x = 300; players[1].x = 540;
  players.forEach(p => {
    p.y = standY(p); p.vx = 0; p.vy = 0; p.grounded = true; p.stealCd = 0.3;
  });
  // P1 starts with the ball
  ball.mode = 'held'; ball.holder = players[0]; ball.flight = null;
  ball.vx = 0; ball.vy = 0;
}

function startGame() {
  if (mode === 'arcade') pickArcadeOpponent();
  rollName(TEAMS[0]); // both slots roll from whoever's pool occupies them
  rollName(TEAMS[1]);
  rollLooks(); // one path for every mode: name decides the face, team decides the kit
  scores = [0, 0];
  timeLeft = GAME_TIME;
  suddenDeath = false;
  winner = null;
  hoopFlash = 0;
  banner = null;
  shake = 0;
  players.forEach(resetPlayerState);
  cpu.decideT = 0; cpu.dir = 0; cpu.wantSteal = false; cpu.shootAt = -1;
  curCpuLevel = mode === 'dynasty' ? dynastyLevel() : cpuLevel;
  players[1].maxMul = cpuSkill(curCpuLevel).speed;
  tipOff();
  state = 'playing';
}

function endGame(teamIdx) {
  winner = teamIdx;
  playBuzzer();
  if (mode === 'dynasty') { endDynastyGame(teamIdx); return; } // dynasty owns its outcome
  // arcade: leveling ladder + run-based leaderboard (practice never calls endGame)
  state = 'over';
  if (teamIdx === 0) cpuLevel = Math.min(8, cpuLevel + 1); // beat the CPU and it comes back sharper
  sessionScore += scores[0];
  entryOpen = teamIdx === 1; // a loss ends the run — post the session total
  if (entryOpen) {
    showInitialsEntry(sessionScore); // the one leaderboard integration point
    sessionScore = 0; // next run starts fresh
  }
}


// ---- leaderboard flow -------------------------------------------------------
const iniInput = document.getElementById('ini');
iniInput.addEventListener('input', () => {
  iniInput.value = iniInput.value.toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 3);
});

function showInitialsEntry(score) {
  myFinalScore = clamp(Math.round(score), 0, SCORE_CAP);
  myEntry = null;
  submitting = false;
  iniInput.value = '';
  setTimeout(() => iniInput.focus(), 50); // desktop gets the caret; mobile taps the slots
}

async function submitInitials() {
  if (submitting || state !== 'over') return;
  const name = iniInput.value;
  if (!/^[A-Z0-9]{1,3}$/.test(name)) { iniInput.focus(); return; }
  submitting = true;
  const res = await Leaderboard.submitScore(name, myFinalScore);
  submitting = false;
  if (res.row) myEntry = res.row;
  openBoard();
}

function openBoard() {
  state = 'board';
  boardData = null;
  iniInput.blur();
  Leaderboard.fetchTopScores(10).then(res => { boardData = res; });
}

function showBanner(text, dur = 2) { banner = { text, t: dur }; }

    fxParts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 60,
                   t: 0, dur: 0.4 + Math.random() * 0.3, r: 2 + Math.random() * 3, col, grav: 700 });
  }
}
function spawnDust(x, y) {
  for (let i = 0; i < 7; i++) {
    fxParts.push({ x: x + (Math.random() - 0.5) * 26, y: y - 2,
                   vx: (Math.random() - 0.5) * 130, vy: -(20 + Math.random() * 60),
                   t: 0, dur: 0.35 + Math.random() * 0.25, r: 3 + Math.random() * 3.5,
                   col: 'rgba(200,180,150,0.55)', grav: 60 });
  }
}
function updateFX(dt) {
  for (let i = fxParts.length - 1; i >= 0; i--) {
    const q = fxParts[i];
    q.t += dt;
    if (q.t >= q.dur) { fxParts.splice(i, 1); continue; }
    q.vy += q.grav * dt;
    q.x += q.vx * dt; q.y += q.vy * dt;
  }
}
function renderFX() {
  fxParts.forEach(q => {
    ctx.save();
    ctx.globalAlpha = 1 - q.t / q.dur;
    ctx.fillStyle = q.col;
    ctx.beginPath(); ctx.arc(q.x, q.y, q.r * (1 - q.t / q.dur * 0.5), 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  });
}

// ============================================================ audio (procedural, Web Audio API)
let AC = null;
function initAudio() {
  if (!AC) {
    try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { AC = null; }
  }
  if (AC && AC.state === 'suspended') AC.resume();
}
function tone(f0, f1, dur, type, vol, delay) {
  if (!AC) return;
  const t0 = AC.currentTime + (delay || 0);
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type || 'sine';
  o.frequency.setValueAtTime(f0, t0);
  if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(Math.max(f1, 1), t0 + dur);
  g.gain.setValueAtTime(vol || 0.2, t0);
  g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
  o.connect(g); g.connect(AC.destination);
  o.start(t0); o.stop(t0 + dur + 0.05);
}
function noiseBurst(dur, vol, freq) {
  if (!AC) return;
  const n = Math.floor(AC.sampleRate * dur);
  const buf = AC.createBuffer(1, n, AC.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
  const src = AC.createBufferSource(); src.buffer = buf;
  const f = AC.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = 0.8;
  const g = AC.createGain(); g.gain.value = vol;
  src.connect(f); f.connect(g); g.connect(AC.destination);
  src.start();
}
const playScore  = () => tone(523.25, 783.99, 0.35, 'triangle', 0.3);      // C5 -> G5 sweep
const playSteal  = () => tone(700, 180, 0.16, 'sawtooth', 0.18);           // descending sting
const playFire   = () => noiseBurst(0.4, 0.35, 1800);                      // sizzle
const playBuzzer = () => tone(180, 180, 1.3, 'square', 0.25);              // flat buzzer
const playRim    = () => tone(150, 90, 0.09, 'square', 0.15);              // clank
const playBlock  = () => tone(260, 70, 0.12, 'square', 0.22);              // swat
const playDunk   = () => { tone(100, 35, 0.35, 'square', 0.4); noiseBurst(0.3, 0.45, 240); }; // slam
const playBounce = () => tone(120, 80, 0.05, 'sine', 0.07);

// ============================================================ input
const keys = {};
const ALL_KEYS = new Set();

    case 'paused':

// ============================================================ actions
function doAction(p) {
  if (ball.mode === 'held' && ball.holder === p) shoot(p);
  else trySteal(p);
}

// DUNK: airborne inside the arc with a clear lane -> fly to the rim and slam
function defenderInLane(p) {
  if (mode === 'practice') return false; // no defender exists to deny
  const opp = players[1 - p.team];
  const x1 = p.x, y1 = p.y, x2 = HOOP.x - 20, y2 = HOOP.y;
  const ddx = x2 - x1, ddy = y2 - y1;
  const len2 = ddx * ddx + ddy * ddy;
  if (len2 < 1) return false;
  const t = clamp(((opp.x - x1) * ddx + (opp.y - y1) * ddy) / len2, 0, 1);
  if (t < 0.15) return false; // defender behind the take-off point doesn't deny
  return Math.hypot(opp.x - (x1 + ddx * t), opp.y - (y1 + ddy * t)) < 55;
}

function startDunk(p) {
  const make = p.fireShots > 0 || Math.random() < 0.9; // flushes most of the time
  p.dunk = { t: 0, dur: 0.45, sx: p.x, sy: p.y, tx: HOOP.x - 22, ty: HOOP.y - 6, make };
  p.fx = 1; // face the hoop
  p.jumpT = 0;
}

function reachRim(p) { // dunk flight arrives at the rim
  const d = p.dunk;
  if (d.make) {
    // SLAM: effects hit now, the ball drops through, and the dunker hangs on the rim
    d.fire = p.fireShots > 0;
    d.hang = 0.55;
    playDunk();
    shake = 0.35;
    hoopFlash = 0.6;
    spawnBurst(HOOP.x, HOOP.y, '#FFD700', 16, 300);
    spawnBurst(HOOP.x, HOOP.y, '#FF7A1A', 8, 180);
    showBanner(TEAMS[p.team].playerName + ' THROWS IT DOWN!', 1.6);
    ball.mode = 'loose'; ball.holder = null;
    ball.x = HOOP.x; ball.y = HOOP.y + 12; ball.vx = 0; ball.vy = 160;
  } else {
    // clanked dunk: no hang, straight off the iron
    p.dunk = null;
    p.vy = 40;
    shake = 0.15;
    ball.holder = null;
    resolveMiss({ shooter: p });
  }
}

function finishDunk(p) { // lets go of the rim; the bucket counts now
  const fire = p.dunk.fire;
  p.dunk = null;
  p.vy = 120;
  resolveMake({ shooter: p, pts: 2, fire, make: true, dunk: true, effectsDone: true });
}

function shoot(p) {
  if (!p.grounded && !p.dunk && p.x < HOOP.x - 26 &&
      Math.abs(ball.x - HOOP.x) < THREE_X && !defenderInLane(p)) {
    startDunk(p);
    return;
  }

  const dx = HOOP.x - ball.x, dy = HOOP.y - ball.y;
  const d = Math.hypot(dx, dy);

  // proximity + angle + motion -> make probability (jumping shortens d = better shot)
  let prob = clamp(1.3 - d / 300, 0.15, 0.95);
  if (p.x > HOOP.x) prob *= 0.4; // behind the backboard
  prob *= 1 - 0.2 * (Math.abs(p.vx) / MAX_SPEED);

  const fire = p.fireShots > 0;
  if (fire) prob = 1;

  const make = Math.random() < prob;
  const pts = Math.abs(ball.x - HOOP.x) > THREE_X ? 3 : 2; // floor 3-pt line

  p.shootT = 0.45; // shoot animation: windup then release
  ball.mode = 'flight';
  ball.holder = null;
  ball.flight = {
    t: 0,
    dur: 0.5 + d / 650,
    sx: ball.x, sy: ball.y,
    tx: make ? HOOP.x : HOOP.x - HOOP.rimHalf,   // make: through the middle; miss: front iron
    ty: HOOP.y,
    peak: 60 + d * 0.22,
    make, pts, fire,
    shooter: p,
  };
}

function trySteal(p) {
  if (p.stealCd > 0) return;
  p.stealCd = 0.8;
  p.jumpT = 0.3; // lunge animation on every attempt
  if (ball.mode !== 'held' || ball.holder.team === p.team || ball.holder.dunk) return; // can't strip a dunker
  const carrier = ball.holder;
  if (Math.hypot(p.x - carrier.x, p.y - carrier.y) > 64) return;
  if (Math.random() < 0.4) {
    ball.holder = p;
    playSteal();
    showBanner(TEAMS[p.team].playerName + ' STEALS!', 1.2);
  }
}

// ============================================================ CPU opponent (P2)
// The arcade CPU starts rusty and levels up each time the player beats it.
let cpuLevel = 0;
function cpuSkill(level) {
  // Piecewise ramps: identical to the original curve through ~Lv.5, then a gentler
  // climb so higher levels keep differentiating (dynasty world stage + Olympics, up to 14).
  const ext = Math.max(0, level - 5);
  return {
    delay: Math.max(0.06, Math.max(0.15, 0.45 - level * 0.06) - ext * 0.01), // reaction delay between decisions
    range: Math.min(380, Math.min(300, 170 + level * 25) + ext * 9),         // shooting range: 2D distance to rim
    stealDist: Math.min(75, Math.min(61, 37 + level * 5) + ext * 1.6),       // how close he must be to pickpocket
    speed: Math.min(1.12, Math.min(1, 0.72 + level * 0.06) + ext * 0.013),   // top-speed multiplier
  };
}
const cpu = { decideT: 0, dir: 0, wantSteal: false, shootAt: -1 };

function cpuThink() {
  const p = players[1];
  const skill = cpuSkill(curCpuLevel);
  cpu.dir = 0;
  if (ball.holder === p) {
    // in possession: attack the hoop, launch when in range
    if (p.x > HOOP.x - 20) { cpu.dir = -1; return; } // get back in front of the rim
    const d = Math.hypot(HOOP.x - ball.x, HOOP.y - ball.y);
    if (d < skill.range) {
      if (p.grounded && cpu.shootAt < 0) { p.vy = -JUMP_V; cpu.shootAt = 0.18; } // rise for a jumper
    } else {
      cpu.dir = 1;
    }
  } else if (ball.mode !== 'flight') {
    // no possession: pursue the ball, loose or carried
    const dx = ball.x - p.x;
    if (Math.abs(dx) > 14) cpu.dir = Math.sign(dx);
    if (ball.mode === 'held' && ball.holder.team === 0 && p.stealCd <= 0 &&
        Math.hypot(p.x - ball.holder.x, p.y - ball.holder.y) < skill.stealDist) {
      cpu.wantSteal = true;
    }
  }
}

function cpuUpdate(dt) {
  const p = players[1];
  cpu.decideT -= dt;
  if (cpu.decideT <= 0) { cpu.decideT = cpuSkill(curCpuLevel).delay; cpuThink(); }
  if (cpu.shootAt >= 0) {
    cpu.shootAt -= dt;
    if (cpu.shootAt < 0) {
      if (ball.holder === p) shoot(p); // release near the top of the jump
      cpu.shootAt = -1;
    }
  }
  if (cpu.wantSteal) { cpu.wantSteal = false; trySteal(p); }
}

// ============================================================ scoring / resolution
function resolveMake(f) {
  const t = f.shooter.team;
  if (mode === 'practice') {
    // count it, drop the ball loose under the rim, and keep shooting — no
    // possession reset, no game end at 21, no fire (PERCENT stays honest)
    prac.attempts++; prac.makes++;
    f.shooter.streak++;
    if (f.dunk) {
      if (!f.effectsDone) { hoopFlash = 0.6; playDunk(); } // reachRim already set the ball loose
    } else {
      hoopFlash = 0.6;
      playScore();
      if (f.pts === 3) showBanner('THREE POINTER!', 1.2);
      ball.mode = 'loose'; ball.flight = null; // resolveMake never writes ball state on the normal path — resetAfterScore does; here we drop it through explicitly
      ball.x = HOOP.x - 4; ball.y = HOOP.y + 16;
      ball.vx = -(50 + Math.random() * 70); ball.vy = 80;
    }
    return;
  }
  scores[t] += f.pts;
  if (f.dunk) {
    if (!f.effectsDone) {
      hoopFlash = 0.6;
      playDunk();
      showBanner(TEAMS[t].playerName + ' THROWS IT DOWN!', 1.5);
    }
  } else {
    hoopFlash = 0.6;
    playScore();
    if (f.pts === 3) showBanner('THREE POINTER!', 1.2);
  }

  const p = f.shooter;
  if (f.fire) {
    p.fireShots--;
    if (p.fireShots <= 0) { p.fireShots = 0; p.streak = 0; }
  } else {
    p.streak++;
    if (p.streak >= 2) {
      p.fireShots = 3;
      playFire();
      showBanner(TEAMS[t].playerName + ' IS ON FIRE! \u{1F525}', 2);
    }
  }

  if (suddenDeath || scores[t] >= WIN_SCORE) { endGame(t); return; }

  resetAfterScore(1 - t);
}

function resolveMiss(f) {
  if (mode === 'practice') prac.attempts++;
  f.shooter.streak = 0;
  playRim();
  // rebound: ball caroms off the front iron back into the court
  ball.mode = 'loose';
  ball.x = HOOP.x - HOOP.rimHalf - 4;
  ball.y = HOOP.y - 6;
  ball.vx = -(80 + Math.random() * 150);
  ball.vy = -(60 + Math.random() * 130);
}

function resetAfterScore(concederIdx) {
  const c = players[concederIdx];
  const s = players[1 - concederIdx];
  // check-ball: conceder takes it out past the 3-pt line, scorer defends the lane
  c.x = 340; s.x = 560;
  [c, s].forEach(p => { p.y = standY(p); p.vx = 0; p.vy = 0; p.grounded = true; });
  s.stealCd = 0.6; // brief inbound immunity
  ball.mode = 'held'; ball.holder = c; ball.flight = null;
  ball.vx = 0; ball.vy = 0;
}

// ============================================================ persistence (guarded)
// First localStorage use in the game. Safari's "Block All Cookies" throws on
// touching localStorage at all — degrade to in-memory play instead of crashing.
function loadKey(key) {
  try {
    const v = JSON.parse(localStorage.getItem(key));
    return v && typeof v === 'object' ? v : null;
  } catch (e) { return null; }
}
function saveKey(key, obj) {
  try { localStorage.setItem(key, JSON.stringify(obj)); } catch (e) { /* no-save mode */ }
}

// ============================================================ dynasty
// A 15-game campaign: Caribbean Qualifiers (5 of 6, shuffled) -> FIBA World Cup
// (6 of 15, shuffled) -> Olympics (CAN/GER/FRA shuffled, USA always the final).
// The drawn schedule lives in the save so resume keeps the same bracket.
const DYN_KEY = 'jajam.dynasty.v1';
const DYN_GAMES = 15;
let dynLossStreak = 0; // consecutive losses on the current game (mercy rule, never saved)
let dynResult = null;  // 'win' | 'loss' for the post-game overlay
let unlockToast = null; // one-line hoop-unlock note on the post-game overlay

function validDyn(d) {
  if (!d || d.v !== 1) return null;
  if (d.schedule !== null && !(Array.isArray(d.schedule) && d.schedule.length === DYN_GAMES &&
      d.schedule.every(id => teamById(id)))) return null;
  if (!Number.isInteger(d.rung) || d.rung < 0 || d.rung >= DYN_GAMES) return null;
  if (!Number.isInteger(d.champs) || d.champs < 0) return null;
  return d;
}
let dyn = validDyn(loadKey(DYN_KEY)); // null = fresh; schedule null = between dynasties

function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) {
    const j = (Math.random() * (i + 1)) | 0;
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function drawSchedule() {
  const carib = shuffle(ROSTER.filter(t => t.pool === 'carib').map(t => t.id)).slice(0, 5);
  const world = shuffle(ROSTER.filter(t => t.pool === 'world').map(t => t.id)).slice(0, 6);
  return carib.concat(world, shuffle(['CAN', 'GER', 'FRA']), ['USA']);
}
const dynStage = rung => rung < 5 ? 'CARIBBEAN QUALIFIERS' : rung < 11 ? 'FIBA WORLD CUP' : 'OLYMPICS';
const dynTeam = () => teamById(dyn.schedule[dyn.rung]);

function newDynasty() {
  dyn = { v: 1, schedule: drawSchedule(), rung: 0, champs: dyn ? dyn.champs : 0 };
  dynLossStreak = 0;
  saveKey(DYN_KEY, dyn);
  state = 'dynastyIntro';
}
function continueDynasty() { dynLossStreak = 0; enterMatchup(); }
function enterMatchup() {
  setOpponent(dynTeam());
  unlockToast = null;
  state = 'matchup';
}
function dynastyLevel() { // fixed per team; 3 straight losses quietly ease it one level
  return Math.max(0, dynTeam().base - (dynLossStreak >= 3 ? 1 : 0));
}
function endDynastyGame(teamIdx) {
  dynResult = teamIdx === 0 ? 'win' : 'loss';
  if (teamIdx === 0) {
    unlockHoopFor(dyn.schedule[dyn.rung]);
    dynLossStreak = 0;
    if (dyn.rung >= DYN_GAMES - 1) { // beat USA in the final
      dyn.champs++; dyn.schedule = null; dyn.rung = 0;
      saveKey(DYN_KEY, dyn);
      state = 'gold';
      return;
    }
    dyn.rung++;
    saveKey(DYN_KEY, dyn); // save only on a completed game — quit/refresh records nothing
  } else {
    dynLossStreak++;
  }
  state = 'dynastyOver';
}

// ============================================================ update
function update(dt) {
  tGlobal += dt;
  if (state !== 'playing') return; // pause freezes everything below, banners included
  if (banner) { banner.t -= dt; if (banner.t <= 0) banner = null; }

  hoopFlash = Math.max(0, hoopFlash - dt);
  shake = Math.max(0, shake - dt);
  updateFX(dt);

  if (mode !== 'practice') {
    cpuUpdate(dt);
    updatePlayer(players[1], cpu.dir, dt); // absent in practice: the court clamp would drag a "parked" body back in
  }
  updatePlayer(players[0], (keys[CONTROLS.right] ? 1 : 0) - (keys[CONTROLS.left] ? 1 : 0), dt);
  updateBall(dt);

  // clock (frozen in practice)
  if (!suddenDeath && mode !== 'practice') {
    timeLeft = Math.max(0, timeLeft - dt);
    if (timeLeft <= 0 && ball.mode !== 'flight' && !players[0].dunk && !players[1].dunk) { // let buzzer-beaters resolve
      if (scores[0] === scores[1]) {
        suddenDeath = true;
        playBuzzer();
        showBanner('OVERTIME! NEXT BASKET WINS', 2.5);
        tipOff();
      } else {
        endGame(scores[0] > scores[1] ? 0 : 1);
      }
    }
  }
}

function updatePlayer(p, ax, dt) {
  p.stealCd = Math.max(0, p.stealCd - dt);
  p.shootT = Math.max(0, p.shootT - dt);
  p.jumpT = Math.max(0, p.jumpT - dt);

  // dunk flight overrides normal physics: carried to the rim on an arc
  if (p.dunk) {
    const d = p.dunk;
    p.vx = 0; p.vy = 0; p.grounded = false;
    if (d.hang !== undefined) {
      // hanging on the rim: hands at rim height, body dangling below
      d.hang -= dt;
      p.x = d.tx + 6 + Math.sin(tGlobal * 9) * 3;
      p.y = HOOP.y + 70 + Math.sin(tGlobal * 9) * 2.5;
      if (d.hang <= 0) finishDunk(p);
      return;
    }
    d.t += dt;
    const u = Math.min(1, d.t / d.dur);
    p.x = d.sx + (d.tx - d.sx) * u;
    p.y = d.sy + (d.ty - d.sy) * u - 46 * Math.sin(Math.PI * u);
    if (u >= 1) reachRim(p);
    return;
  }

  // horizontal: accel + friction (less control in the air)
  p.vx += ax * ACCEL * (p.grounded ? 1 : 0.55) * dt;
  p.vx *= Math.max(0, 1 - (p.grounded ? FRICTION : 1.2) * dt);
  const max = (ball.holder === p ? CARRIER_SPEED : 1) * MAX_SPEED * (p.maxMul || 1);
  if (Math.abs(p.vx) > max) p.vx = Math.sign(p.vx) * max;
  p.x += p.vx * dt;
  if (p.x < COURT.left + p.w / 2) { p.x = COURT.left + p.w / 2; p.vx = 0; }
  if (p.x > COURT.right - p.w / 2) { p.x = COURT.right - p.w / 2; p.vx = 0; }

  // vertical: gravity, land on the ground plane
  p.vy += GRAV * dt;
  p.y += p.vy * dt;
  const sy = standY(p);
  if (p.y >= sy) {
    if (!p.grounded && p.vy > 560) spawnDust(p.x, FLOOR + 2);
    p.y = sy; p.vy = 0; p.grounded = true;
  }
  else p.grounded = false;

  if (Math.abs(p.vx) > 15) p.fx = Math.sign(p.vx);
  if (p.grounded && Math.abs(p.vx) > 40) p.runT += dt;
  else if (p.grounded) p.runT = 0;
}

function updateBall(dt) {
  if (ball.mode === 'held') {
    const h = ball.holder;
    if (h.dunk) { // ball rides the dunk pose: cocked behind the head, then whipped through
      const u = h.dunk.hang !== undefined ? 1 : Math.min(1, h.dunk.t / h.dunk.dur);
      if (u < 0.7) { ball.x = h.x - h.fx * 7; ball.y = h.y - 72; }
      else { ball.x = h.x + h.fx * 30; ball.y = h.y - 50; }
      return;
    }
    ball.x = h.x + h.fx * 26;
    ball.y = h.y - 3;
    return;
  }

  if (ball.mode === 'flight') {
    const f = ball.flight;
    f.t += dt;
    if (f.fire && Math.random() < 0.7) {
      fxParts.push({ x: ball.x, y: ball.y, vx: (Math.random() - 0.5) * 40, vy: -30 - Math.random() * 50,
                     t: 0, dur: 0.3, r: 4 + Math.random() * 3, col: 'rgba(255,120,20,0.7)', grav: -150 });
    }
    const u = Math.min(1, f.t / f.dur);
    ball.x = f.sx + (f.tx - f.sx) * u;
    ball.y = f.sy + (f.ty - f.sy) * u - f.peak * Math.sin(Math.PI * u); // real arc over the rim

    // BLOCK: an airborne defender who meets the rising ball swats it loose.
    // Fire shots are unblockable — 100% means 100%.
    if (!f.fire && u > 0.08 && u < 0.55) {
      for (const p of players) {
        if (p === f.shooter || p.grounded) continue;
        if (Math.hypot(p.x - ball.x, (p.y - 15) - ball.y) < 34) {
          ball.mode = 'loose';
          ball.flight = null;
          ball.vx = (p.x < HOOP.x ? -1 : 1) * (150 + Math.random() * 150); // swat away from the hoop
          ball.vy = -(20 + Math.random() * 120);
          f.shooter.streak = 0;
          playBlock();
          showBanner(TEAMS[p.team].playerName + ' WITH THE BLOCK!', 1.5);
          return;
        }
      }
    }

    if (u >= 1) {
      ball.flight = null;
      if (f.make) resolveMake(f); else resolveMiss(f);
    }
    return;
  }

  // loose: projectile physics
  ball.vy += BALL_GRAV * dt;
  ball.x += ball.vx * dt;
  ball.y += ball.vy * dt;
  const rest = FLOOR - 11;
  if (ball.y > rest) {
    ball.y = rest;
    if (ball.vy > 90) { ball.vy = -ball.vy * 0.55; playBounce(); }
    else ball.vy = 0;
  }
  const rolling = ball.y >= rest - 0.5 && ball.vy === 0;
  ball.vx *= Math.max(0, 1 - (rolling ? 1.8 : 0.15) * dt);
  if (ball.x < COURT.left + 11) { ball.x = COURT.left + 11; ball.vx = -ball.vx * 0.7; }
  if (ball.x > BB_X - 11) { ball.x = BB_X - 11; ball.vx = -ball.vx * 0.7; }

  // pickup on contact
  for (const p of players) {
    if (mode === 'practice' && p.team === 1) continue; // the absent opponent grabs nothing
    if (Math.hypot(p.x - ball.x, p.y - ball.y) < 40) {
      ball.mode = 'held'; ball.holder = p;
      ball.vx = 0; ball.vy = 0;
      break;
    }
  }
}

// ============================================================ render helpers
function rrect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

// ---- UI chrome helpers: chunky panels + buttons with hard shadows
function drawPanel(x, y, w, h, border, r) {
  r = r || 12;
  ctx.save();
  ctx.fillStyle = 'rgba(0,0,0,0.45)';
  rrect(x, y + 5, w, h, r); ctx.fill();
  const g = ctx.createLinearGradient(0, y, 0, y + h);
  g.addColorStop(0, '#1C1826'); g.addColorStop(1, '#100D18');
  ctx.fillStyle = g;
  rrect(x, y, w, h, r); ctx.fill();
  ctx.strokeStyle = border || '#EE6723'; ctx.lineWidth = 3;
  rrect(x, y, w, h, r); ctx.stroke();
  ctx.strokeStyle = 'rgba(255,255,255,0.08)'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(x + r, y + 3.5); ctx.lineTo(x + w - r, y + 3.5); ctx.stroke();
  ctx.restore();
}
function drawBtn(rct, label, opts) {
  opts = opts || {};
  const { x, y, w, h } = rct;
  const v = opts.variant || 'menu', sel = !!opts.sel;

  else if (v === 'ghost') { fill = ['rgba(22,22,30,0.85)', 'rgba(14,14,20,0.85)']; border = 'rgba(154,176,200,0.55)'; txt = '#9AB0C8'; }
  else if (sel) { fill = ['#FF8438', '#E05A10']; border = '#FFE3C4'; txt = '#FFFFFF'; }
  else { fill = ['#FFF6E8', '#F5DFC0']; border = '#E85D04'; txt = '#9A3412'; }
  ctx.save();
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  rrect(x, y + 4, w, h, 10); ctx.fill();
  const g = ctx.createLinearGradient(0, y, 0, y + h);
  g.addColorStop(0, fill[0]); g.addColorStop(1, fill[1]);
  ctx.fillStyle = g;
  rrect(x, y, w, h, 10); ctx.fill();
  ctx.strokeStyle = border; ctx.lineWidth = 3;
  rrect(x, y, w, h, 10); ctx.stroke();
  ctx.font = opts.font || 'bold 18px Arial, sans-serif';

    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.fillText(label, x + w / 2, y + h / 2 + 2);

  ctx.fillText(label, x + w / 2, y + h / 2);

}
function drawLogo(cx, cy, size) {

// ============================================================ render
function render() {
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = '#0A1628';
  ctx.fillRect(0, 0, W, H);

  if (state === 'title') { renderTitle(); return; }
  if (state === 'help') { renderHelp(); return; }
  if (state === 'board') { renderBoard(); return; }
  if (state === 'dynastyIntro') { renderDynastyIntro(); return; }
  if (state === 'matchup') { renderMatchup(); return; }
  if (state === 'gold') { renderGold(); return; }
  if (state === 'hoops') { renderHoops(); return; }
  if (state !== 'playing' && state !== 'paused' && state !== 'over' && state !== 'dynastyOver') return; // unknown state: blank frame, never the court

  ctx.save();
  if (shake > 0) ctx.translate((Math.random() - 0.5) * 14 * shake, (Math.random() - 0.5) * 10 * shake);

  renderCourt();
  renderHUD();

  // ground shadows (shrink with height)
  const ballH = clamp(1 - (FLOOR - 11 - ball.y) / 300, 0.35, 1);
  renderShadow(ball.x, FLOOR + 4, 13 * ballH + 4, 5, 0.35 * ballH);
  players.forEach(p => {
    if (mode === 'practice' && p.team === 1) return; // absent opponent casts no shadow
    const k = clamp(1 - (standY(p) - p.y) / 200, 0.45, 1);
    renderShadow(p.x, FLOOR + 5, 33 * k, 8, 0.3 * k);
  });

  players.forEach(p => {
    if (mode === 'practice' && p.team === 1) return; // and isn't drawn
    renderPlayer(p);
  });
  renderBall();
  renderHoop(); // rim + net render in front of the ball
  renderFX();

  if (banner && banner.text) renderBanner();
  if (state === 'over') renderWin();
  if (state === 'dynastyOver') renderDynastyOver();
  if (state === 'paused') renderPause();
  ctx.restore();
}

function renderPause() {
  ctx.fillStyle = 'rgba(10,22,40,0.82)';
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = 'bold 52px Arial, sans-serif';
  ctx.fillStyle = '#FFD700';
  ctx.fillText('PAUSED', CX, 190);

  drawBtn(resumeRect(), 'RESUME', { variant: 'primary' });
  drawBtn(quitRect(), 'QUIT  [Q]', { variant: 'ghost' });

  ctx.font = '13px "Courier New", monospace';
  ctx.fillStyle = '#9AB0C8';
  ctx.fillText('any key or tap resumes', CX, 240);
}

function renderShadow(x, y, rx, ry, alpha) {
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.fillStyle = '#000';
  ctx.beginPath();
  ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

function renderCourt() {
  // arena backdrop: deep gradient + spotlight cones
  const bg = ctx.createLinearGradient(0, 80, 0, FLOOR);
  bg.addColorStop(0, '#101A2E');
  bg.addColorStop(1, '#0A1020');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 90, W, FLOOR - 90);
  ctx.save();
  ctx.globalAlpha = 0.07;
  ctx.fillStyle = '#BFD8FF';
  [180, 480, 680].forEach(sx => {
    ctx.beginPath();
    ctx.moveTo(sx - 24, 88); ctx.lineTo(sx + 24, 88);
    ctx.lineTo(sx + 120, FLOOR); ctx.lineTo(sx - 120, FLOOR);
    ctx.closePath(); ctx.fill();
  });
  ctx.restore();

  // crowd: rows of bobbing heads, back rows darker (cheap parallax)
  for (let row = 0; row < 5; row++) {
    const y0 = 128 + row * 44;
    const dim = 0.35 + row * 0.14;
    for (let i = 0; i < 27; i++) {
      const seed = (i * 37 + row * 61) % 97;
      if (seed % 5 === 0) continue;
      const cxp = 12 + i * 30 + (row % 2) * 15;
      const bobA = Math.sin(tGlobal * (1.6 + (seed % 5) * 0.35) + seed) * 2.2;
      const shirt = ['#31435E', '#4A3A63', '#2E5546', '#5E4230', '#413F52'][seed % 5];
      const skinT = ['#8D5524', '#C68642', '#5C3317', '#E0AC69'][seed % 4];
      ctx.save();
      ctx.globalAlpha = dim;
      ctx.fillStyle = shirt;
      rrect(cxp - 8, y0 + 10 + bobA, 16, 22, 5); ctx.fill();
      ctx.fillStyle = skinT;
      ctx.beginPath(); ctx.arc(cxp, y0 + 4 + bobA, 6.5, 0, Math.PI * 2); ctx.fill();
      if (seed % 7 === 0) { // a fan waving
        ctx.strokeStyle = skinT; ctx.lineWidth = 3; ctx.lineCap = 'round';
        ctx.beginPath(); ctx.moveTo(cxp + 7, y0 + 12 + bobA);
        ctx.lineTo(cxp + 12, y0 - 2 + bobA + Math.sin(tGlobal * 7 + seed) * 3);
        ctx.stroke();
      }
      ctx.restore();
    }
  }

  // courtside ad apron
  const ap = ctx.createLinearGradient(0, 396, 0, FLOOR);
  ap.addColorStop(0, '#131A28'); ap.addColorStop(1, '#0B111D');
  ctx.fillStyle = ap;
  ctx.fillRect(0, 396, W, FLOOR - 396);
  ctx.fillStyle = 'rgba(255,255,255,0.06)';
  ctx.fillRect(0, 396, W, 2);
  ctx.font = 'bold 16px Arial, sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const ads = [
    ['JA JAM', '#FED100'], ['BACKCOURT', '#EE6723'], ['DYNASTY', '#00B45A'],
    ['JA JAM', '#FED100'], ['BACKCOURT', '#EE6723'],
  ];
  ads.forEach((ad, i) => {
    const ax = 80 + i * 160;
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    rrect(ax - 66, 404, 132, 26, 4); ctx.fill();
    ctx.strokeStyle = ad[1] + '44'; ctx.lineWidth = 1.5; ctx.stroke();
    ctx.fillStyle = ad[1] + 'AA';
    ctx.fillText(ad[0], ax, 418);
  });

  // hardwood: gradient planks with lacquer sheen
  const fg = ctx.createLinearGradient(0, FLOOR, 0, H);
  fg.addColorStop(0, '#D8B278');
  fg.addColorStop(0.35, '#C49B60');
  fg.addColorStop(1, '#8E6B3C');
  ctx.fillStyle = fg;
  ctx.fillRect(0, FLOOR, W, H - FLOOR);
  for (let x = 0; x < W; x += 46) {
    ctx.fillStyle = (x / 46) % 2 ? 'rgba(80,50,15,0.10)' : 'rgba(255,240,210,0.07)';
    ctx.fillRect(x, FLOOR, 46, H - FLOOR);
  }
  ctx.fillStyle = 'rgba(60,36,10,0.25)';
  ctx.fillRect(0, FLOOR + 26, W, 1.5);
  // sheen
  const sh = ctx.createLinearGradient(0, FLOOR, 0, FLOOR + 16);
  sh.addColorStop(0, 'rgba(255,255,255,0.30)');
  sh.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = sh;
  ctx.fillRect(0, FLOOR, W, 16);
  // painted key under the hoop
  ctx.fillStyle = 'rgba(238,103,35,0.22)';
  ctx.fillRect(HOOP.x - 120, FLOOR + 2, W - (HOOP.x - 120), 26);
  ctx.strokeStyle = 'rgba(255,255,255,0.85)';
  ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(0, FLOOR + 1.5); ctx.lineTo(W, FLOOR + 1.5); ctx.stroke();

  // floor markings: 3-pt line + check-ball circle
  const tx = HOOP.x - THREE_X;
  ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.moveTo(tx, FLOOR + 3); ctx.lineTo(tx, FLOOR + 28); ctx.stroke();
  ctx.font = 'bold 11px "Courier New", monospace';
  ctx.fillStyle = '#FFFFFF';
  ctx.fillText('3PT', tx - 17, FLOOR + 14);
  ctx.save();
  ctx.globalAlpha = 0.5;
  ctx.beginPath(); ctx.ellipse(340, FLOOR + 15, 42, 9, 0, 0, Math.PI * 2); ctx.stroke();
  ctx.restore();
}

function renderHoop() {
  const hs = curHoopStyle(); // cosmetic colors only — geometry constants never move
  // padded stanchion arm from the wall
  ctx.lineCap = 'round';
  ctx.strokeStyle = '#232C38'; ctx.lineWidth = 13;
  ctx.beginPath(); ctx.moveTo(W, 206); ctx.lineTo(BB_X + 4, 216); ctx.stroke();
  ctx.strokeStyle = '#38455A'; ctx.lineWidth = 9;
  ctx.beginPath(); ctx.moveTo(W, 205); ctx.lineTo(BB_X + 4, 215); ctx.stroke();

  // glass backboard with frame + specular streak
  const bbTop = 183, bbH = 98, bbW = 13;
  ctx.fillStyle = 'rgba(190,215,240,0.30)';
  rrect(BB_X - 3, bbTop, bbW, bbH, 3); ctx.fill();
  ctx.strokeStyle = hs.bb; ctx.lineWidth = 3;
  rrect(BB_X - 3, bbTop, bbW, bbH, 3); ctx.stroke();
  ctx.strokeStyle = 'rgba(255,255,255,0.5)'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(BB_X - 1, bbTop + 8); ctx.lineTo(BB_X + 6, bbTop + 30); ctx.stroke();
  // shooter square hint at rim height
  ctx.strokeStyle = hs.trim; ctx.lineWidth = 2.5;
  ctx.strokeRect(BB_X - 3, HOOP.y - 26, 8, 22);

  // rim: bracket, shadowed bar, highlight
  ctx.fillStyle = shade(hs.rim, -0.35);
  ctx.fillRect(HOOP.x + HOOP.rimHalf - 2, HOOP.y - 4, BB_X - (HOOP.x + HOOP.rimHalf) + 1, 7); // mount
  ctx.fillStyle = shade(hs.rim, -0.4);
  rrect(HOOP.x - HOOP.rimHalf - 3, HOOP.y - 1, HOOP.rimHalf * 2 + 7, 6, 3); ctx.fill();
  ctx.fillStyle = hs.rim;
  rrect(HOOP.x - HOOP.rimHalf - 3, HOOP.y - 3, HOOP.rimHalf * 2 + 7, 6, 3); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.35)';
  rrect(HOOP.x - HOOP.rimHalf - 1, HOOP.y - 2.5, HOOP.rimHalf * 2 + 3, 1.8, 1); ctx.fill();

  // net: diamond lattice, whips downward right after a bucket
  const whip = hoopFlash > 0.32 ? (hoopFlash - 0.32) * 26 : 0;
  const topY = HOOP.y + 3, midY = HOOP.y + 15 + whip * 0.6, botY = HOOP.y + 27 + whip;
  const topXs = [], midXs = [], botXs = [];
  for (let i = 0; i <= 4; i++) {
    topXs.push(HOOP.x - HOOP.rimHalf + 2 + i * (HOOP.rimHalf * 2 - 4) / 4);
    midXs.push(HOOP.x + (HOOP.x - HOOP.rimHalf + 2 + i * (HOOP.rimHalf * 2 - 4) / 4 - HOOP.x) * 0.72);
    botXs.push(HOOP.x + (HOOP.x - HOOP.rimHalf + 2 + i * (HOOP.rimHalf * 2 - 4) / 4 - HOOP.x) * 0.5);
  }
  ctx.strokeStyle = hs.net;
  ctx.lineWidth = 1.6;
  for (let i = 0; i < 4; i++) {
    ctx.beginPath(); ctx.moveTo(topXs[i], topY); ctx.lineTo(midXs[i + 1], midY); ctx.lineTo(botXs[i], botY); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(topXs[i + 1], topY); ctx.lineTo(midXs[i], midY); ctx.lineTo(botXs[i + 1], botY); ctx.stroke();
  }
  ctx.beginPath(); ctx.moveTo(botXs[0], botY); ctx.lineTo(botXs[4], botY); ctx.stroke();

  // score flash
  if (hoopFlash > 0) {
    const k = 1 - hoopFlash / 0.6;
    ctx.save();
    ctx.globalAlpha = 1 - k;
    ctx.strokeStyle = '#FFD700';
    ctx.lineWidth = 6;
    ctx.beginPath(); ctx.arc(HOOP.x, HOOP.y, 16 + k * 40, 0, Math.PI * 2); ctx.stroke();
    ctx.restore();
  }
}

function renderPlayer(p) {
  const team = TEAMS[p.team];
  const look = LOOKS[p.team];
  const F = look.face;
  const onFire = p.fireShots > 0;
  const footY = p.y + p.h / 2;

  // fire aura under the body
  if (onFire) {
    const flick = 0.55 + 0.45 * Math.sin(tGlobal * 18 + p.team * 3);
    const g = ctx.createRadialGradient(p.x, p.y - 22, 10, p.x, p.y - 22, 78);
    g.addColorStop(0, 'rgba(255,140,0,' + (0.6 * flick) + ')');
    g.addColorStop(1, 'rgba(255,60,0,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(p.x, p.y - 22, 78, 0, Math.PI * 2); ctx.fill();
  }

  ctx.save();
  ctx.translate(p.x, footY);
  ctx.scale(p.fx < 0 ? -1.13 : 1.13, 1.13); // big-league scale

  // ---- pose: joints in feet-origin local coords, +x = facing, -y = up
  let legFar = { k: [-6, -15], a: [-9, 0] }, legNear = { k: [7, -15], a: [10, 0] };
  let armFar = { e: [-17, -38], h: [-19, -24] }, armNear = { e: [19, -38], h: [21, -24] };
  let lean = 0, bob = 0;
  const carrying = ball.mode === 'held' && ball.holder === p && !p.dunk && p.shootT <= 0;

  if (p.dunk) {
    const d = p.dunk;
    if (d.hang !== undefined) { // swinging on the rim, both hands up
      armFar = { e: [6, -72], h: [10, -98] };
      armNear = { e: [17, -72], h: [21, -98] };
      legFar = { k: [-5, -11], a: [-10, 3] };
      legNear = { k: [7, -11], a: [2, 5] };
      lean = 0.07 * Math.sin(tGlobal * 9);
    } else {
      const u = Math.min(1, d.t / d.dur);
      lean = 0.28 * u;
      legFar = { k: [-10, -19], a: [-19, -7] };
      legNear = { k: [12, -17], a: [19, -9] };
      armFar = { e: [-15, -45], h: [-11, -30] };
      armNear = u < 0.7
        ? { e: [6, -68], h: [-9, -100] }   // tomahawk: ball cocked behind the head
        : { e: [22, -62], h: [34, -78] };  // whipping through the rim
    }
  } else if (p.shootT > 0) {
    if (p.shootT > 0.3) {
      armFar = { e: [-9, -54], h: [4, -84] };
      armNear = { e: [18, -54], h: [13, -86] };
    } else {
      armFar = { e: [-2, -72], h: [2, -102] };
      armNear = { e: [13, -72], h: [9, -104] };
    }
    if (p.grounded) { legFar = { k: [-5, -15], a: [-8, 0] }; legNear = { k: [7, -15], a: [10, 0] }; }
    else { legFar = { k: [-4, -19], a: [-8, -9] }; legNear = { k: [9, -19], a: [12, -11] }; }
  } else if (!p.grounded) {
    legFar = { k: [-3, -21], a: [-10, -9] };
    legNear = { k: [10, -19], a: [4, -7] };
    armFar = { e: [-17, -46], h: [-13, -60] };
    armNear = { e: [21, -46], h: [27, -58] };
  } else if (p.jumpT > 0) { // steal lunge
    armNear = { e: [20, -40], h: [34, -33] };
    armFar = { e: [-15, -40], h: [-11, -30] };
    lean = 0.13;
  } else if (Math.abs(p.vx) > 40) {
    const s = Math.sin(p.runT * 13);
    bob = Math.abs(Math.cos(p.runT * 13)) * 1.8;
    legFar = { k: [-7 + 9 * s, -17], a: [-5 + 16 * s, s > 0 ? -7 : 0] };
    legNear = { k: [7 - 9 * s, -17], a: [5 - 16 * s, s < 0 ? -7 : 0] };
    armFar = { e: [-14 - 6 * s, -39], h: [-16 - 11 * s, -26 + 4 * s] };
    armNear = { e: [16 + 6 * s, -39], h: [18 + 11 * s, -26 - 4 * s] };
    lean = 0.08;
  } else {
    bob = Math.sin(tGlobal * 3 + p.team * 2) * 1.4;
  }
  if (carrying) armNear = { e: [20, -42], h: [25, -31] };

  if (lean) ctx.rotate(lean);
  const shY = -52 - bob, hipY = -28, headY = -70 - bob;

  const skin = look.skin, skinD = shade(skin, -0.3), skinL = shade(skin, 0.2);
  const outline = 'rgba(16,12,9,0.7)';
  const jersey = team.main, acc = team.accent;
  const hairCol = '#181411';

  const limb = (x1, y1, x2, y2, r, col) => {
    ctx.lineCap = 'round';
    ctx.strokeStyle = outline; ctx.lineWidth = r * 2 + 3;
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
    ctx.strokeStyle = col; ctx.lineWidth = r * 2;
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
    // cylinder shading: key light top-left, core shadow bottom-right
    ctx.strokeStyle = shade(col, 0.28); ctx.lineWidth = r * 0.9;
    ctx.beginPath(); ctx.moveTo(x1 - 1.3, y1 - 1.6); ctx.lineTo(x2 - 1.3, y2 - 1.6); ctx.stroke();
    ctx.strokeStyle = shade(col, -0.3); ctx.lineWidth = r * 0.75;
    ctx.beginPath(); ctx.moveTo(x1 + 1.5, y1 + 1.7); ctx.lineTo(x2 + 1.5, y2 + 1.7); ctx.stroke();
  };
  const hand = (h, col) => {
    ctx.fillStyle = col;
    ctx.beginPath(); ctx.arc(h[0], h[1], 5.6, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = outline; ctx.lineWidth = 1.8; ctx.stroke();
  };
  const shoe = (ax, ay) => { // chunky sneaker pointing +x
    ctx.fillStyle = '#F6F6F6';
    rrect(ax - 9, ay - 9, 22, 10.5, 4.5); ctx.fill();
    ctx.strokeStyle = outline; ctx.lineWidth = 2; ctx.stroke();
    ctx.fillStyle = '#DDDDDD';
    rrect(ax - 9, ay - 2.5, 22, 4, 2); ctx.fill();
    ctx.strokeStyle = acc; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(ax - 3, ay - 7.5); ctx.quadraticCurveTo(ax + 4, ay - 4, ax + 11, ay - 6.5); ctx.stroke();
    ctx.fillStyle = shade(jersey, -0.1);
    rrect(ax - 9, ay - 9, 6, 6, 2.5); ctx.fill(); // heel patch
  };

  // ---- far side (shaded)
  limb(-12, shY + 3, armFar.e[0], armFar.e[1], 5.4, shade(skin, -0.2));
  limb(armFar.e[0], armFar.e[1], armFar.h[0], armFar.h[1], 4.8, shade(skin, -0.2));
  hand(armFar.h, shade(skin, -0.2));
  limb(-6, hipY + 5, legFar.k[0], legFar.k[1], 7, skinD);
  limb(legFar.k[0], legFar.k[1], legFar.a[0], legFar.a[1], 5.8, skinD);
  shoe(legFar.a[0], legFar.a[1]);

  // ---- shorts + jersey (broad shoulders, tapered waist)
  ctx.fillStyle = '#191920';
  rrect(-13.5, hipY - 4, 27, 18, 7); ctx.fill();
  ctx.strokeStyle = outline; ctx.lineWidth = 2.2; ctx.stroke();
  ctx.fillStyle = acc; ctx.fillRect(-13.5, hipY + 10.5, 27, 3);
  const jg = ctx.createLinearGradient(0, shY, 0, hipY + 2);
  jg.addColorStop(0, shade(jersey, 0.18)); jg.addColorStop(1, shade(jersey, -0.28));
  ctx.beginPath();
  ctx.moveTo(-16, shY - 2);
  ctx.quadraticCurveTo(0, shY - 7, 16, shY - 2);   // shoulder line
  ctx.lineTo(13, hipY + 4);
  ctx.quadraticCurveTo(0, hipY + 7, -13, hipY + 4);
  ctx.closePath();
  ctx.fillStyle = jg; ctx.fill();
  ctx.strokeStyle = outline; ctx.lineWidth = 2.4; ctx.stroke();
  // volume: chest sheen + core shadow along the back edge
  ctx.save();
  ctx.globalAlpha = 0.22;
  ctx.fillStyle = '#FFFFFF';
  ctx.beginPath(); ctx.ellipse(-4, shY + 9, 7, 5, -0.4, 0, Math.PI * 2); ctx.fill();
  ctx.globalAlpha = 0.25;
  ctx.strokeStyle = '#000';
  ctx.lineWidth = 3.5;
  ctx.beginPath(); ctx.moveTo(-13.5, shY + 3); ctx.lineTo(-11.5, hipY + 2); ctx.stroke();
  ctx.restore();
  // shoulder caps
  ctx.fillStyle = shade(jersey, 0.05);
  ctx.beginPath(); ctx.arc(-14, shY + 1, 5.5, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(14, shY + 1, 5.5, 0, Math.PI * 2); ctx.fill();
  // side trim + neckline
  ctx.strokeStyle = acc; ctx.lineWidth = 2.6;
  ctx.beginPath(); ctx.moveTo(-14.5, shY + 1); ctx.lineTo(-12, hipY + 3); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(14.5, shY + 1); ctx.lineTo(12, hipY + 3); ctx.stroke();
  ctx.strokeStyle = acc; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(0, shY - 1, 6.5, 0.25, Math.PI - 0.25); ctx.stroke();
  // jersey number (counter-flipped so it never mirrors)
  ctx.save();
  if (p.fx < 0) ctx.scale(-1, 1);
  ctx.font = 'bold 12px Arial, sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = acc;
  ctx.fillText(String(F.num), p.fx < 0 ? -1 : 1, shY + 15);
  ctx.restore();

  // ---- near side
  limb(6, hipY + 5, legNear.k[0], legNear.k[1], 7, skin);
  limb(legNear.k[0], legNear.k[1], legNear.a[0], legNear.a[1], 5.8, skin);
  shoe(legNear.a[0], legNear.a[1]);
  limb(12, shY + 3, armNear.e[0], armNear.e[1], 5.4, skin);
  limb(armNear.e[0], armNear.e[1], armNear.h[0], armNear.h[1], 4.8, skin);
  hand(armNear.h, skin);

  // ---- the big head (chin overlaps the chest — pure big-head energy)
  const hx = 3, hrx = 24, hry = 25;
  ctx.beginPath(); ctx.arc(hx - 20, headY + 4, 6.2, 0, Math.PI * 2); // ear (back side)
  ctx.fillStyle = skin; ctx.fill();
  ctx.strokeStyle = outline; ctx.lineWidth = 2; ctx.stroke();
  // drop shadow of the head onto the chest (ambient occlusion)
  ctx.save();
  ctx.globalAlpha = 0.28;
  ctx.fillStyle = '#000';
  ctx.beginPath(); ctx.ellipse(hx, headY + hry - 2, hrx * 0.7, 6, 0, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
  const hg = ctx.createRadialGradient(hx - 9, headY - 12, 4, hx + 2, headY + 3, hrx + 9);
  hg.addColorStop(0, shade(skin, 0.42));
  hg.addColorStop(0.35, skinL);
  hg.addColorStop(0.68, skin);
  hg.addColorStop(0.88, skinD);
  hg.addColorStop(1, shade(skin, -0.45));
  ctx.beginPath(); ctx.ellipse(hx, headY, hrx, hry, 0, 0, Math.PI * 2);
  ctx.fillStyle = hg; ctx.fill();
  ctx.strokeStyle = outline; ctx.lineWidth = 2.6; ctx.stroke();
  // rim light on the lit edge + specular
  ctx.save();
  ctx.globalAlpha = 0.5;
  ctx.strokeStyle = shade(skin, 0.55); ctx.lineWidth = 2.6;
  ctx.beginPath(); ctx.ellipse(hx, headY, hrx - 2, hry - 2, 0, Math.PI * 1.05, Math.PI * 1.55); ctx.stroke();
  ctx.globalAlpha = 0.3;
  ctx.fillStyle = '#FFFFFF';
  ctx.beginPath(); ctx.ellipse(hx - 9, headY - 11, 4.5, 3, -0.5, 0, Math.PI * 2); ctx.fill();
  ctx.restore();

  // hair (clipped to the skull so it hugs the curve)
  ctx.save();
  ctx.beginPath(); ctx.ellipse(hx, headY, hrx + 1, hry + 1, 0, 0, Math.PI * 2); ctx.clip();
  ctx.fillStyle = hairCol;
  if (look.hair === 'hitop') {
    ctx.fillRect(hx - hrx - 1, headY - hry - 1, hrx * 2 + 2, hry - 8); // squared top
  } else if (look.hair === 'locs') {
    ctx.beginPath(); ctx.ellipse(hx - 2, headY - 6, hrx - 1, hry - 6, 0, Math.PI * 0.9, Math.PI * 2.05); ctx.fill();
  } else { // fade: low dome hugging the skull
    ctx.beginPath(); ctx.ellipse(hx - 1, headY - 4, hrx - 1, hry - 3, 0, Math.PI * 1.02, Math.PI * 1.98); ctx.fill();
  }
  ctx.restore();
  // hair gloss
  ctx.save();
  ctx.globalAlpha = 0.16;
  ctx.strokeStyle = '#9FB6FF'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.ellipse(hx - 2, headY - 4, hrx - 5, hry - 7, 0, Math.PI * 1.15, Math.PI * 1.6); ctx.stroke();
  ctx.restore();
  if (look.hair === 'hitop') { // flat-top block above the skull
    ctx.fillStyle = hairCol;
    rrect(hx - 15, headY - hry - 12, 30, 15, 3); ctx.fill();
    ctx.strokeStyle = outline; ctx.lineWidth = 2; ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,0.12)';
    ctx.fillRect(hx - 15, headY - hry - 12, 30, 3);
  }
  if (look.hair === 'locs') { // locs swinging off the back
    for (let i = 0; i < 5; i++) {
      const lx = hx - hrx + 2 + i * 3.6;
      const sway = Math.sin(tGlobal * 4 + i) * 1.5;
      limb(lx, headY - 8 + i, lx - 4 + sway, headY + 14 + (i % 2) * 5, 2.8, hairCol);
    }
  }

  // headband hugging the forehead curve
  ctx.save();
  ctx.beginPath(); ctx.ellipse(hx, headY, hrx + 0.5, hry + 0.5, 0, 0, Math.PI * 2); ctx.clip();
  const bandG = ctx.createLinearGradient(0, headY - 13, 0, headY - 5);
  bandG.addColorStop(0, shade(acc, 0.3)); bandG.addColorStop(0.5, acc); bandG.addColorStop(1, shade(acc, -0.35));
  ctx.fillStyle = bandG;
  ctx.fillRect(hx - hrx - 1, headY - 13, hrx * 2 + 2, 7.5);
  ctx.restore();

  // ---- face (3/4 toward the play)
  const eyeCol = onFire ? '#E03000' : '#181410';
  const eF = [hx + 3, headY + 1], eN = [hx + 16, headY + 2];
  const eyeR = F.eyes === 2 ? 6.6 : 5.8, eyeH = F.eyes === 1 ? 4 : 6.4;
  [eF, eN].forEach(e => {
    ctx.fillStyle = '#FFFFFF';
    ctx.beginPath(); ctx.ellipse(e[0], e[1], eyeR, eyeH, 0, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,0.45)'; ctx.lineWidth = 1.4;
    ctx.stroke();
    ctx.fillStyle = eyeCol;
    ctx.beginPath(); ctx.arc(e[0] + 2, e[1] + 0.6, 3, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    ctx.beginPath(); ctx.arc(e[0] + 1, e[1] - 0.6, 1, 0, Math.PI * 2); ctx.fill();
  });
  // brows
  ctx.strokeStyle = hairCol; ctx.lineWidth = 3.2; ctx.lineCap = 'round';
  const angry = onFire || F.brows === 2;
  ctx.beginPath();
  ctx.moveTo(eF[0] - 5, eF[1] - (angry ? 11 : 10));
  ctx.lineTo(eF[0] + 5, eF[1] - (angry ? 7.5 : 10.5));
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(eN[0] - 5, eN[1] - (angry ? 7.5 : 10.5));
  ctx.lineTo(eN[0] + 5, eN[1] - (angry ? 11 : 10));
  ctx.stroke();
  // nose
  ctx.strokeStyle = 'rgba(0,0,0,0.4)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(hx + 21, headY + 6); ctx.quadraticCurveTo(hx + 23.5, headY + 9.5, hx + 20, headY + 11); ctx.stroke();
  // mouth
  const my = headY + 16;
  if (onFire) {
    ctx.fillStyle = '#5E1010';
    rrect(hx + 4, my - 2, 15, 7, 3); ctx.fill();
    ctx.strokeStyle = '#FFFFFF'; ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.moveTo(hx + 5.5, my + 1.4); ctx.lineTo(hx + 17.5, my + 1.4); ctx.stroke();
  } else if (F.mouth === 1) { // grin
    ctx.strokeStyle = '#3A1808'; ctx.lineWidth = 2.6;
    ctx.beginPath(); ctx.arc(hx + 10, my - 3, 7.5, 0.2, Math.PI - 0.55); ctx.stroke();
  } else if (F.mouth === 2) { // game-face shout
    ctx.fillStyle = '#4A1A0A';
    ctx.beginPath(); ctx.ellipse(hx + 11, my, 5, 3.8, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#F4F4F4';
    ctx.fillRect(hx + 7.5, my - 3.2, 7, 2);
  } else {
    ctx.strokeStyle = '#3A1808'; ctx.lineWidth = 2.6;
    ctx.beginPath(); ctx.moveTo(hx + 4, my); ctx.quadraticCurveTo(hx + 11, my + 2.5, hx + 17, my); ctx.stroke();
  }
  // chin shading
  ctx.strokeStyle = 'rgba(0,0,0,0.12)'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.arc(hx + 2, headY + 2, hry - 5, Math.PI * 0.28, Math.PI * 0.66); ctx.stroke();

  ctx.restore();

  // name label above the hair
  const labelY = footY - 148;
  ctx.font = 'bold 12px "Courier New", monospace';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.lineWidth = 3.5;
  ctx.strokeStyle = 'rgba(0,0,0,0.75)';
  ctx.strokeText(team.playerName, p.x, labelY);
  ctx.fillStyle = '#FFF';
  ctx.fillText(team.playerName, p.x, labelY);
  if (onFire) ctx.fillText('\u{1F525}', p.x, labelY - 15);
}

const BALL_R = 13;
function renderBall() {
  const r = BALL_R, bx = ball.x, by = ball.y;
  const g = ctx.createRadialGradient(bx - r * 0.4, by - r * 0.45, r * 0.15, bx, by, r * 1.05);
  g.addColorStop(0, '#FF9F45');
  g.addColorStop(0.55, '#F07018');
  g.addColorStop(1, '#A54307');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(bx, by, r, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = 'rgba(45,16,0,0.8)';
  ctx.lineWidth = 2;
  ctx.stroke();
  ctx.save();
  ctx.globalAlpha = 0.5;
  ctx.fillStyle = '#FFE0B8';
  ctx.beginPath(); ctx.ellipse(bx - r * 0.42, by - r * 0.48, r * 0.3, r * 0.2, -0.6, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
  // seams spin as the ball travels
  const rot = (bx * 0.9 + by * 0.5) * 0.045;
  ctx.save();
  ctx.beginPath(); ctx.arc(bx, by, r - 0.6, 0, Math.PI * 2); ctx.clip();
  ctx.translate(bx, by); ctx.rotate(rot);
  ctx.strokeStyle = 'rgba(70,25,0,0.85)';
  ctx.lineWidth = 1.8;
  ctx.beginPath();
  ctx.moveTo(-r, 0); ctx.lineTo(r, 0);
  ctx.moveTo(0, -r); ctx.lineTo(0, r);
  ctx.arc(-r * 0.95, 0, r * 0.95, -0.95, 0.95);
  ctx.arc(r * 0.95, 0, r * 0.95, Math.PI - 0.95, Math.PI + 0.95);
  ctx.stroke();
  ctx.restore();
}

function renderHUD() {
  ctx.textBaseline = 'middle';
  if (mode === 'practice') {
    // shootaround scoreboard plate
    drawPanel(CX - 190, 14, 380, 52, '#EE6723');
    const pct = prac.attempts ? Math.round(prac.makes * 100 / prac.attempts) + '%' : '--';
    ctx.font = 'bold 26px "Courier New", monospace';
    ctx.textAlign = 'left';
    ctx.fillStyle = '#FED100';
    ctx.fillText('PCT ' + pct, CX - 170, 41);
    ctx.textAlign = 'right';
    ctx.fillStyle = '#EE6723';
    ctx.fillText('STK ' + players[0].streak, CX + 170, 41);

function flagBorder(x, y, w, h) {

function flagStripesH(x, y, w, h, cols) {
  const n = cols.length;
  cols.forEach((c, i) => { ctx.fillStyle = c; ctx.fillRect(x, y + h * i / n, w, h / n + 0.6); });
}
function flagStripesV(x, y, w, h, cols) {
  const n = cols.length;

}
function flagTri(x, y, w, h, frac, col) { // hoist triangle, apex at frac of the width
  ctx.fillStyle = col;
  ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + w * frac, y + h / 2); ctx.lineTo(x, y + h);
  ctx.closePath(); ctx.fill();
}
function flagStar(cx, cy, r, col) { // 5-point star
  ctx.fillStyle = col;
  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const ang = -Math.PI / 2 + i * Math.PI / 5;
    const rr = i % 2 ? r * 0.45 : r;
    const px = cx + Math.cos(ang) * rr, py = cy + Math.sin(ang) * rr;
    i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
  }
  ctx.closePath(); ctx.fill();
}

  const half = ctx.measureText(matchup).width / 2;
  const fw = 27, fh = 17;
  drawJamFlag(CX - half - 9 - fw, 178 - fh / 2, fw, fh);
  (TEAMS[1].drawFlag || drawBahFlag)(CX + half + 9, 178 - fh / 2, fw, fh);

  ctx.font = '12px "Courier New", monospace';
  ctx.fillStyle = '#9AB0C8';
  const touchOn = getComputedStyle(touchPanel).display !== 'none';
  ctx.fillText(touchOn ? 'd-pad moves - SHOOT selects' : 'arrows move - ENTER selects', CX, 208);

  MENU.forEach((m, i) => {
    const r = menuRect(i);
    const sel = i === menuSel;
    drawBtn(r, m.label(), { sel });
    if (sel) {
      ctx.fillStyle = '#FED100';
      ctx.font = 'bold 20px "Courier New", monospace';
      ctx.textAlign = 'right'; ctx.fillText('>', r.x - 10, r.y + r.h / 2);
      ctx.textAlign = 'left'; ctx.fillText('<', r.x + r.w + 10, r.y + r.h / 2);
    }
  });

  drawBtn(helpRect(), 'HOW TO PLAY  [H]', { variant: 'ghost', font: '13px "Courier New", monospace' });
  drawBtn(boardRect(), 'LEADERBOARD  [L]', { variant: 'ghost', font: '13px "Courier New", monospace' });
}

function renderHelp() {
  renderStripes();

  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = 'bold 34px Arial, sans-serif';
  ctx.fillStyle = '#FFD700';
  ctx.fillText('HOW TO PLAY', CX, 92);

  ctx.font = '15px "Courier New", monospace';
  ctx.fillStyle = '#E8EEF6';
  const lines = [
    '←→ move    ↑ jump    SPACE shoot / steal    P pause',
    'On phones: use the touch buttons',
    '',
    'First to 21, or best score in 2:00 — tie goes to OT',
    '2 straight buckets = ON FIRE \u{1F525}  (3 guaranteed shots)',
    'No ball? Crowd the carrier and press SPACE to STEAL',
    'Jump into a rising shot to BLOCK it (fire is unblockable)',
    'Inside the arc: jump + shoot = DUNK (denied if the D is in the lane)',
    'ARCADE: rotating FIBA opponents — win and the CPU sharpens (Lv.' + (cpuLevel + 1) + ')',
    'DYNASTY: 15 games, qualifiers to Olympic gold — wins unlock hoops',
    'PRACTICE: empty court, live shooting percentage',
  ];
  lines.forEach((ln, i) => ctx.fillText(ln, CX, 142 + i * 24));

  const pulse = 0.6 + 0.4 * Math.sin(tGlobal * 4);
  ctx.font = 'bold 20px Arial, sans-serif';
  ctx.fillStyle = 'rgba(255,255,255,' + pulse + ')';
  ctx.fillText('PRESS ANY KEY FOR THE MENU', CX, 434);
}

function playAgainRect() { return { x: CX - 100, y: 392, w: 200, h: 42 }; }
function matchupPlayRect() { return { x: CX - 100, y: 356, w: 200, h: 46 }; }
function matchupBackRect() { return { x: 20, y: 18, w: 116, h: 32 }; }

// ============================================================ dynasty screens
// Palette: near-black base, Jamaican green/gold, BACKCOURT orange accents.
const BC_ORANGE = '#EE6723';

function renderDynastyIntro() {
  ctx.fillStyle = '#0B0B0C'; ctx.fillRect(0, 0, W, H);
  renderStripes();
  drawPanel(CX - 330, 44, 660, 424, '#EE6723', 16);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = 'bold 54px Arial, sans-serif';
  ctx.fillStyle = '#FED100';
  ctx.fillText('DYNASTY', CX, 96);
  ctx.font = 'bold 16px "Courier New", monospace';
  ctx.fillStyle = BC_ORANGE;
  ctx.fillText('QUALIFIERS  >  WORLD CUP  >  OLYMPICS', CX, 148);

  ctx.font = '15px "Courier New", monospace';
  ctx.fillStyle = '#E8EEF6';
  const first = dynTeam();
  const lines = [
    'The road starts on island soil and ends on the Olympic podium.',
    '15 games. Every dynasty draws a fresh field —',
    'but the top never changes: USA waits in the final.',
    '',
    'Lose and you run it back. Progress saves between sessions.',
    '',
    'GAME 1: ' + first.full.replace('TEAM ', '') + ' — ' + dynStage(0),
  ];
  lines.forEach((ln, i) => ctx.fillText(ln, CX, 208 + i * 26));
  if (dyn.champs > 0) {
    ctx.fillStyle = '#FED100';
    ctx.fillText('GOLD MEDALS: ' + dyn.champs, CX, 400);
  }
  const pulse = 0.6 + 0.4 * Math.sin(tGlobal * 4);
  ctx.font = 'bold 19px Arial, sans-serif';
  ctx.fillStyle = 'rgba(255,255,255,' + pulse + ')';
  ctx.fillText('PRESS ANY KEY', CX, 448);
}

function renderMatchup() {
  ctx.fillStyle = '#0B0B0C'; ctx.fillRect(0, 0, W, H);
  renderStripes();
  drawPanel(CX - 300, 64, 600, 366, '#EE6723', 16);
  const t = dynTeam();
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';

  ctx.font = 'bold 15px "Courier New", monospace';
  ctx.fillStyle = BC_ORANGE;
  ctx.fillText(dynStage(dyn.rung), CX, 92);
  ctx.font = 'bold 30px Arial, sans-serif';
  ctx.fillStyle = '#FED100';
  ctx.fillText('GAME ' + (dyn.rung + 1) + ' OF ' + DYN_GAMES, CX, 132);

  // matchup line: centered ASCII + drawn flags at measured offsets (iOS-safe pattern)
  ctx.font = 'bold 24px Arial, sans-serif';
  ctx.fillStyle = '#FFFFFF';
  const matchup = 'JAMAICA  vs  ' + t.full.replace('TEAM ', '');
  ctx.fillText(matchup, CX, 210);
  const half = ctx.measureText(matchup).width / 2;
  const fw = 36, fh = 23;
  drawJamFlag(CX - half - 12 - fw, 210 - fh / 2, fw, fh);
  t.drawFlag(CX + half + 12, 210 - fh / 2, fw, fh);

  ctx.font = '14px "Courier New", monospace';
  ctx.fillStyle = '#9AB0C8';
  ctx.fillText('CPU Lv.' + (dynastyLevel() + 1) + (dynLossStreak > 0 ? '  -  attempt ' + (dynLossStreak + 1) : ''), CX, 252);
  if (dyn.rung === DYN_GAMES - 1) {
    ctx.fillStyle = '#FED100';
    ctx.fillText('THE GOLD-MEDAL FINAL', CX, 280);
  }

  drawBtn(matchupPlayRect(), 'TIP OFF', { variant: 'primary' });
  ctx.font = '12px "Courier New", monospace';
  ctx.fillStyle = '#9AB0C8';
  ctx.textAlign = 'center';
  ctx.fillText('(or press Enter)', CX, matchupPlayRect().y + 64);
  drawBtn(matchupBackRect(), '< BACK [ESC]', { variant: 'ghost', font: '13px "Courier New", monospace' });
}

function renderDynastyOver() {
  ctx.fillStyle = 'rgba(8,8,10,0.82)';
  ctx.fillRect(0, 0, W, H);
  drawPanel(CX - 270, 62, 540, 310, '#EE6723', 16);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const won = dynResult === 'win';
  ctx.font = 'bold 40px Arial, sans-serif';
  ctx.fillStyle = won ? '#FED100' : '#FF5050';
  ctx.fillText(won ? 'GAME ' + dyn.rung + ' WON!' : 'TOUGH LOSS', CX, 110);
  ctx.font = 'bold 28px "Courier New", monospace';
  ctx.fillStyle = '#FFFFFF';
  ctx.fillText(scores[0] + '  -  ' + scores[1], CX, 158);

  ctx.font = 'bold 16px "Courier New", monospace';
  if (won) {
    const next = dynTeam();
    ctx.fillStyle = BC_ORANGE;
    ctx.fillText(dynStage(dyn.rung) + ' - NEXT: ' + next.full.replace('TEAM ', ''), CX, 212);
  } else {
    ctx.fillStyle = '#9AB0C8';
    ctx.fillText('RUN IT BACK - ' + dynTeam().full.replace('TEAM ', '') + ' AGAIN', CX, 212);
  }
  if (unlockToast) {
    ctx.fillStyle = '#FED100';
    ctx.font = 'bold 15px "Courier New", monospace';
    ctx.fillText(unlockToast, CX, 246);
  }
  const pulse = 0.6 + 0.4 * Math.sin(tGlobal * 4);
  ctx.font = 'bold 19px Arial, sans-serif';
  ctx.fillStyle = 'rgba(255,255,255,' + pulse + ')';
  ctx.fillText('PRESS ANY KEY', CX, 330);
}

function hoopRect(i) {
  const col = i % 4, row = (i / 4) | 0;
  return { x: 72 + col * 168, y: 128 + row * 156, w: 152, h: 138 };
}
function hoopsBackRect() { return { x: 20, y: 18, w: 116, h: 32 }; }

function renderHoops() {
  ctx.fillStyle = '#0B0B0C'; ctx.fillRect(0, 0, W, H);
  renderStripes();
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = 'bold 34px Arial, sans-serif';
  ctx.fillStyle = '#FED100';
  ctx.fillText('HOOP DESIGNS', CX, 70);

  HOOP_STYLES.forEach((s, i) => {
    const r = hoopRect(i);
    const unlocked = hoops.unlocked.includes(s.id);
    const active = hoops.selected === s.id;
    const cursor = hoopsSel === i;

    ctx.fillStyle = unlocked ? 'rgba(28,28,31,0.92)' : 'rgba(18,18,20,0.92)';
    rrect(r.x, r.y, r.w, r.h, 10); ctx.fill();
    // border: gold = equipped, orange = cursor, dim = the rest
    ctx.lineWidth = active || cursor ? 3 : 1.5;
    ctx.strokeStyle = active ? '#FED100' : cursor ? BC_ORANGE : 'rgba(154,176,200,0.35)';
    ctx.stroke();

    // mini hoop preview in the style's colors
    const hx = r.x + r.w / 2, hy = r.y + 52;
    ctx.save();
    if (!unlocked) ctx.globalAlpha = 0.35;
    ctx.fillStyle = s.bb;   ctx.fillRect(hx + 26, hy - 28, 6, 54);
    ctx.fillStyle = s.trim; ctx.fillRect(hx + 21, hy + 4, 5, 8);
    ctx.fillStyle = s.rim;  ctx.fillRect(hx - 16, hy + 6, 38, 5);
    ctx.strokeStyle = s.net; ctx.lineWidth = 1.5;
    for (let n = 0; n <= 3; n++) {
      const nx = hx - 12 + n * 10;
      ctx.beginPath(); ctx.moveTo(nx, hy + 11); ctx.lineTo(hx + (nx - hx) * 0.5 - 2, hy + 32); ctx.stroke();
    }
    ctx.restore();

    ctx.font = 'bold 12px "Courier New", monospace';
    ctx.fillStyle = unlocked ? '#E8EEF6' : 'rgba(154,176,200,0.6)';
    ctx.fillText(s.label, r.x + r.w / 2, r.y + r.h - 38);
    ctx.font = '10px "Courier New", monospace';
    if (!unlocked) {
      ctx.fillStyle = 'rgba(154,176,200,0.7)';
      ctx.fillText(s.unlock === 'USA' ? 'WIN OLYMPIC GOLD' : 'BEAT ' + teamById(s.unlock).full.replace('TEAM ', ''), r.x + r.w / 2, r.y + r.h - 20);
    } else if (active) {
      ctx.fillStyle = '#FED100';
      ctx.fillText('EQUIPPED', r.x + r.w / 2, r.y + r.h - 20);
    }
    if (cursor && !unlocked && tGlobal < lockedFlashUntil && Math.floor(tGlobal * 8) % 2) {
      ctx.font = 'bold 18px Arial, sans-serif';
      ctx.fillStyle = '#FF5050';
      ctx.fillText('LOCKED', r.x + r.w / 2, r.y + 56);
    }
  });

  drawBtn(hoopsBackRect(), '< BACK [ESC]', { variant: 'ghost', font: '13px "Courier New", monospace' });

  ctx.font = '12px "Courier New", monospace';
  ctx.fillStyle = '#9AB0C8';
  const touchOn = getComputedStyle(touchPanel).display !== 'none';
  ctx.fillText(touchOn ? 'd-pad moves - SHOOT equips - JUMP backs out' : 'arrows move - ENTER equips - ESC backs out', CX, 462);
}

function renderGold() {
  ctx.fillStyle = '#0B0B0C'; ctx.fillRect(0, 0, W, H);
  // gold rays
  ctx.save();
  ctx.translate(CX, 190);
  for (let i = 0; i < 12; i++) {
    ctx.rotate(Math.PI / 6);
    ctx.fillStyle = 'rgba(254,209,0,' + (0.05 + 0.04 * Math.sin(tGlobal * 2 + i)) + ')';
    ctx.fillRect(-14, 0, 28, 260);
  }
  ctx.restore();
  renderStripes();
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = 'bold 56px Arial, sans-serif';
  ctx.fillStyle = '#FED100';
  ctx.fillText('OLYMPIC GOLD', CX, 130);
  ctx.font = 'bold 22px Arial, sans-serif';
  ctx.fillStyle = '#FFFFFF';
  ctx.fillText('JAMAICA - CHAMPIONS OF THE WORLD', CX, 186);
  // medal
  ctx.fillStyle = '#FED100';
  ctx.beginPath(); ctx.arc(CX, 262, 36, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#B8860B';
  ctx.font = 'bold 30px Arial, sans-serif';
  ctx.fillText('1', CX, 264);
  ctx.strokeStyle = BC_ORANGE; ctx.lineWidth = 5;
  ctx.beginPath(); ctx.moveTo(CX - 22, 232); ctx.lineTo(CX - 6, 200); ctx.moveTo(CX + 22, 232); ctx.lineTo(CX + 6, 200); ctx.stroke();

  ctx.font = 'bold 16px "Courier New", monospace';
  ctx.fillStyle = BC_ORANGE;
  ctx.fillText('GOLD MEDALS: ' + dyn.champs, CX, 336);
  ctx.font = '13px "Courier New", monospace';
  ctx.fillStyle = '#9AB0C8';
  ctx.fillText('a new dynasty draws a new road - your hoops stay unlocked', CX, 364);
  const pulse = 0.6 + 0.4 * Math.sin(tGlobal * 4);
  ctx.font = 'bold 19px Arial, sans-serif';
  ctx.fillStyle = 'rgba(255,255,255,' + pulse + ')';
  ctx.fillText('PRESS ANY KEY', CX, 430);
}

function renderWin() {
  ctx.fillStyle = 'rgba(10,22,40,0.92)';
  ctx.fillRect(0, 0, W, H);
  const team = TEAMS[winner];
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = 'bold 40px Arial, sans-serif';
  ctx.fillStyle = team.accent;
  ctx.fillText(team.full + ' WINS!', CX, 96);
  ctx.font = 'bold 28px "Courier New", monospace';
  ctx.fillStyle = '#FFFFFF';
  ctx.fillText(scores[0] + '  –  ' + scores[1], CX, 142);
  if (winner === 0) {
    ctx.font = '14px "Courier New", monospace';
    ctx.fillStyle = '#FF8C00';
    ctx.fillText(TEAMS[1].playerName + ' LEVELS UP — CPU Lv.' + (cpuLevel + 1) + ' next game', CX, 172);
  }

  if (!entryOpen) {
    // run continues: keep playing, total banks toward the board on a loss
    ctx.font = 'bold 16px "Courier New", monospace';
    ctx.fillStyle = '#00C2DD';
    ctx.fillText('RUN TOTAL: ' + sessionScore + ' PTS', CX, 214);
    ctx.font = '12px "Courier New", monospace';
    ctx.fillStyle = '#9AB0C8';
    ctx.fillText('lose and it posts to the leaderboard', CX, 238);
    const b = overPlayRect();
    drawBtn(b, 'PLAY AGAIN', { variant: 'primary' });
    ctx.font = '13px "Courier New", monospace';
    ctx.fillStyle = '#9AB0C8';
    ctx.fillText('(or press Enter)', CX, b.y + b.h + 20);
    return;
  }

  // run over: arcade initials entry for the session total
  ctx.font = 'bold 18px Arial, sans-serif';
  ctx.fillStyle = '#FFFFFF';
  ctx.fillText('RUN OVER — ' + myFinalScore + ' PTS — ENTER YOUR INITIALS', CX, 216);
  const v = iniInput.value;
  for (let i = 0; i < 3; i++) {
    const sx = CX - 78 + i * 56, sy = 246, sw = 46, sh = 56;
    ctx.strokeStyle = i === v.length ? '#00C2DD' : 'rgba(154,176,200,0.6)';
    ctx.lineWidth = i === v.length ? 3 : 2;
    rrect(sx, sy, sw, sh, 8);
    ctx.stroke();
    if (v[i]) {
      ctx.font = 'bold 34px "Courier New", monospace';
      ctx.fillStyle = '#FFD700';
      ctx.fillText(v[i], sx + sw / 2, sy + sh / 2 + 2);
    } else if (i === v.length && Math.floor(tGlobal * 2.5) % 2) {
      ctx.font = 'bold 34px "Courier New", monospace';
      ctx.fillStyle = '#00C2DD';
      ctx.fillText('_', sx + sw / 2, sy + sh / 2 + 2);
    }
  }
  ctx.font = '12px "Courier New", monospace';
  ctx.fillStyle = '#9AB0C8';
  const touchOn = getComputedStyle(touchPanel).display !== 'none';
  ctx.fillText(touchOn ? 'tap the boxes to type' : 'type letters • ENTER to post', CX, 326);

  // post / skip buttons
  const g = goRect(), s = skipRect();
  const canPost = /^[A-Z0-9]{1,3}$/.test(v) && !submitting;
  ctx.fillStyle = canPost ? '#009B3A' : 'rgba(0,155,58,0.35)';
  rrect(g.x, g.y, g.w, g.h, 10); ctx.fill();
  ctx.lineWidth = 2.5;
  ctx.strokeStyle = canPost ? '#FFD700' : 'rgba(255,215,0,0.35)';
  ctx.stroke();
  ctx.font = 'bold 16px Arial, sans-serif';
  ctx.fillStyle = '#FFFFFF';
  ctx.fillText(submitting ? 'POSTING…' : 'POST SCORE', g.x + g.w / 2, g.y + g.h / 2);
  ctx.strokeStyle = 'rgba(154,176,200,0.7)';
  ctx.lineWidth = 2;
  rrect(s.x, s.y, s.w, s.h, 10); ctx.stroke();
  ctx.fillStyle = '#9AB0C8';
  ctx.fillText('SKIP', s.x + s.w / 2, s.y + s.h / 2);
  if (!Leaderboard.isLive) {
    ctx.font = '11px "Courier New", monospace';
    ctx.fillText('demo board — Supabase not configured yet', CX, 430);
  }
}

function renderBoard() {
  renderStripes();
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = 'bold 34px Arial, sans-serif';
  ctx.fillStyle = '#FFD700';
  ctx.fillText('LEADERBOARD', CX, 76);

  ctx.font = 'bold 16px "Courier New", monospace';
  if (!boardData) {
    ctx.fillStyle = '#9AB0C8';
    ctx.fillText('LOADING…', CX, 240);
  } else if (boardData.error) {
    ctx.fillStyle = '#FF5050';
    ctx.fillText("couldn't reach the board", CX, 240);
  } else if (boardData.rows.length === 0) {
    ctx.fillStyle = '#9AB0C8';
    ctx.fillText('no scores yet — be the first!', CX, 240);
  } else {
    boardData.rows.forEach((r, i) => {
      const y = 116 + i * 26;
      const mine = myEntry && r.id === myEntry.id;
      if (i === 0) { // flame highlight on #1
        const fg = ctx.createLinearGradient(CX - 170, y, CX + 170, y);
        fg.addColorStop(0, 'rgba(255,60,0,0)');
        fg.addColorStop(0.5, 'rgba(255,120,0,0.3)');
        fg.addColorStop(1, 'rgba(255,60,0,0)');
        ctx.fillStyle = fg;
        ctx.fillRect(CX - 170, y - 12, 340, 24);
      }
      if (mine) { // aqua highlight on the player's own row
        ctx.fillStyle = 'rgba(0,194,221,0.18)';
        ctx.fillRect(CX - 170, y - 12, 340, 24);
        ctx.strokeStyle = 'rgba(0,194,221,0.8)';
        ctx.lineWidth = 1.5;
        ctx.strokeRect(CX - 170, y - 12, 340, 24);
      }
      ctx.fillStyle = i === 0 ? '#FFD700' : mine ? '#7FE3F2' : '#E8EEF6';
      ctx.textAlign = 'right';
      ctx.fillText((i + 1) + '.', CX - 120, y);
      ctx.textAlign = 'left';
      ctx.fillText(r.name, CX - 96, y);
      ctx.textAlign = 'right';
      ctx.fillText(String(r.score), CX + 150, y);
    });
    ctx.textAlign = 'center';
  }

  drawBtn(playAgainRect(), 'PLAY', { variant: 'primary' });
  if (!Leaderboard.isLive) {
    ctx.font = '11px "Courier New", monospace';
    ctx.fillStyle = '#9AB0C8';
    ctx.fillText('demo board — resets on refresh until Supabase is configured', CX, 460);
  }
}

// ============================================================ main loop
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.033, (now - last) / 1000);
  last = now;
  update(dt);
  render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
