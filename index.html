<style>

// ============================================================ leaderboard (Supabase)
const SCORE_CAP = 999; // leaderboard score = session run total across games (arcade 3 digits)
const CONFIG = {
  SUPABASE_URL: '',      // e.g. 'https://xxxx.supabase.co'
  SUPABASE_ANON_KEY: '', // anon public key (safe to ship client-side; RLS enforces rules)
};

const Leaderboard = (() => {
  const live = !!(CONFIG.SUPABASE_URL && CONFIG.SUPABASE_ANON_KEY && window.supabase);
  const client = live ? window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY) : null;
  // in-memory mock so the UI runs before the backend is wired (deliberately not localStorage)
  const mock = [
    { id: 'm1', name: 'BUD', score: 21, created_at: '2026-07-01T00:00:00Z' },
    { id: 'm2', name: 'JAM', score: 15, created_at: '2026-07-01T00:01:00Z' },
    { id: 'm3', name: 'BAH', score: 9,  created_at: '2026-07-01T00:02:00Z' },
  ];
  const valid = (name, score) =>
    /^[A-Z0-9]{1,3}$/.test(name) && Number.isInteger(score) && score >= 0 && score <= SCORE_CAP;

  async function submitScore(name, score) {
    if (!valid(name, score)) return { error: 'invalid score or initials' };
    if (!live) {
      const row = { id: 'm' + Math.random().toString(36).slice(2), name, score, created_at: new Date().toISOString() };
      mock.push(row);
      return { row };
    }
    try {
      const { data, error } = await client.from('scores').insert({ name, score }).select().single();
      return error ? { error: error.message } : { row: data };
    } catch (e) { return { error: String(e) }; }
  }

  async function fetchTopScores(limit = 10) {
    if (!live) {
      const rows = mock.slice()
        .sort((a, b) => b.score - a.score || a.created_at.localeCompare(b.created_at))
        .slice(0, limit);
      return { rows };
    }
    try {
      const { data, error } = await client.from('scores')
        .select('id,name,score,created_at')
        .order('score', { ascending: false })
        .order('created_at', { ascending: true })
        .limit(limit);
      return error ? { error: error.message } : { rows: data };
    } catch (e) { return { error: String(e) }; }
  }

  return { submitScore, fetchTopScores, isLive: live };
})();

// ============================================================ procedural pixel-art sprites
// 32x32 big-head figures generated at load into offscreen canvases, drawn at 2x.
// Per team: idle x2, run x4, jump x1, shoot x2.
const SPRITE_PX = 32, SPRITE_SCALE = 2, SPRITE_SIZE = SPRITE_PX * SPRITE_SCALE;

// deterministic per-name looks: a given name always gets the same face
function nameHash(s) {
  let h = 0;
  for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0;
  return Math.abs(h);
}
function faceFor(name) {
  const h = nameHash(name);
  return { eyes: h % 3, brows: ((h / 3) | 0) % 3, mouth: ((h / 9) | 0) % 3 };
}
const JAM_SKINS = ['#5C3317', '#8D5524', '#6E4023'];
const JAM_HAIR = ['locs', 'hitop', 'none'];

function makeSpriteSet(teamIdx, skin, hairStyle, face) {
  const MAIN = TEAMS[teamIdx].main, ACC = TEAMS[teamIdx].accent;
  const HAIR = '#161616', SHOE = '#F2F2F2', EYE = '#0E0E0E', MOUTH = '#2E1808', SHORTS = '#141414';
  const F = face || { eyes: 0, brows: 0, mouth: 0 };

  function frame(opts) {
    const c = document.createElement('canvas');
    c.width = SPRITE_PX; c.height = SPRITE_PX;
    const g = c.getContext('2d');
    const px = (x, y, w, h, col) => { g.fillStyle = col; g.fillRect(x, y, w, h); };
    const b = opts.bob || 0; // head bob offset (feet stay planted)
    const onFire = !!opts.fireFace;

    // --- big head (rows 0..14, +b)
    px(8, 1 + b, 16, 4, HAIR);                                    // hair cap
    if (hairStyle === 'hitop') px(9, b, 14, 1, HAIR);             // hi-top fade
    if (hairStyle === 'locs') { px(6, 5 + b, 1, 6, HAIR); px(25, 5 + b, 1, 6, HAIR); } // side locs
    px(8, 5 + b, 16, 2, ACC);                                     // headband
    px(8, 7 + b, 16, 8, skin);                                    // face
    px(7, 9 + b, 1, 4, skin); px(24, 9 + b, 1, 4, skin);          // ears

    // --- expressive face: brows / eyes / mouth vary per player, snarl when on fire
    const eyeCol = onFire ? '#E03000' : EYE;
    if (onFire || F.brows === 2) {                                // angled game-face brows
      px(11, 9 + b, 3, 1, HAIR); px(18, 9 + b, 3, 1, HAIR);
      px(13, 10 + b, 1, 1, HAIR); px(18, 10 + b, 1, 1, HAIR);
    } else if (F.brows === 1) {                                   // flat brows
      px(11, 9 + b, 3, 1, HAIR); px(18, 9 + b, 3, 1, HAIR);
    }
    if (F.eyes === 1) {                                           // narrowed
      px(12, 11 + b, 2, 1, eyeCol); px(18, 11 + b, 2, 1, eyeCol);
    } else if (F.eyes === 2) {                                    // wide with whites
      px(11, 10 + b, 3, 2, '#F4F4F4'); px(18, 10 + b, 3, 2, '#F4F4F4');
      px(12, 10 + b, 2, 2, eyeCol); px(19, 10 + b, 2, 2, eyeCol);
    } else {                                                      // classic
      px(12, 10 + b, 2, 2, eyeCol); px(18, 10 + b, 2, 2, eyeCol);
    }
    if (onFire) {                                                 // gritted snarl
      px(13, 12 + b, 6, 2, '#7A1010'); px(14, 12 + b, 4, 1, '#F4F4F4');
    } else if (F.mouth === 1) {                                   // grin
      px(13, 13 + b, 5, 1, MOUTH); px(12, 12 + b, 1, 1, MOUTH); px(18, 12 + b, 1, 1, MOUTH);
    } else if (F.mouth === 2) {                                   // open (mid-shout)
      px(14, 12 + b, 3, 2, MOUTH);
    } else {                                                      // neutral
      px(14, 13 + b, 4, 1, MOUTH);
    }

    // --- jersey (rows 15..20)
    px(10, 15, 12, 1, ACC);                                       // shoulder trim
    px(10, 16, 12, 5, MAIN);                                      // jersey
    px(14, 17, 4, 2, ACC);                                        // number blob

    // --- shorts (rows 21..22)
    px(10, 21, 12, 1, ACC);
    px(10, 22, 12, 1, SHORTS);

    // --- legs + shoes (rows 23..31)
    switch (opts.legs) {
      case 'stand':
        px(12, 23, 2, 6, skin); px(18, 23, 2, 6, skin);
        px(11, 29, 4, 3, SHOE); px(17, 29, 4, 3, SHOE);
        break;
      case 'together':
        px(14, 23, 2, 6, skin); px(16, 23, 2, 6, skin);
        px(13, 29, 4, 3, SHOE); px(16, 29, 4, 3, SHOE);
        break;
      case 'runA': // left leg striding, right trailing
        px(9, 23, 3, 5, skin); px(8, 28, 4, 3, SHOE);
        px(19, 23, 3, 4, skin); px(20, 26, 4, 3, SHOE);
        break;
      case 'runB': // mirror of runA
        px(20, 23, 3, 5, skin); px(20, 28, 4, 3, SHOE);
        px(10, 23, 3, 4, skin); px(8, 26, 4, 3, SHOE);
        break;
      case 'tuck': // knees up mid-air
        px(12, 23, 2, 3, skin); px(18, 23, 2, 3, skin);
        px(11, 26, 4, 3, SHOE); px(17, 26, 4, 3, SHOE);
        break;
    }

    // --- arms (drawn last, in front of torso)
    switch (opts.arms) {
      case 'down':   px(8, 16, 2, 6, skin); px(22, 16, 2, 6, skin); break;
      case 'swingA': px(8, 15, 2, 4, skin); px(22, 17, 2, 6, skin); break;
      case 'swingB': px(8, 17, 2, 6, skin); px(22, 15, 2, 4, skin); break;
      case 'up':     px(5, 9 + b, 3, 7, skin); px(24, 9 + b, 3, 7, skin); break;   // windup by the ears
      case 'extend': px(5, 4 + b, 3, 11, skin); px(24, 4 + b, 3, 11, skin); break; // full overhead release
    }
    return c;
  }

  const set = fireFace => ({
    idle:  [frame({ arms: 'down', legs: 'stand', bob: 0, fireFace }),
            frame({ arms: 'down', legs: 'stand', bob: 1, fireFace })],
    run:   [frame({ arms: 'swingA', legs: 'runA', fireFace }),
            frame({ arms: 'down', legs: 'together', bob: 1, fireFace }),
            frame({ arms: 'swingB', legs: 'runB', fireFace }),
            frame({ arms: 'down', legs: 'together', bob: 0, fireFace })],
    jump:  [frame({ arms: 'up', legs: 'tuck', fireFace })],
    shoot: [frame({ arms: 'up', legs: 'stand', fireFace }),
            frame({ arms: 'extend', legs: 'tuck', fireFace })],
  });
  return { norm: set(false), fire: set(true) }; // fire mode wears the snarl
}

let lastOppIdx = -1;

function setOpponent(t) {
  Object.assign(TEAMS[1], t); // sprites regenerate in startGame, after the name roll
}

function pickArcadeOpponent() { // random rotation, never the same team twice in a row
  let i;
  do { i = (Math.random() * ROSTER.length) | 0; } while (ROSTER.length > 1 && i === lastOppIdx);
  lastOppIdx = i;
  setOpponent(ROSTER[i]);
}

// ============================================================ state
let state = 'title'; // title | help | playing | paused | over | board (+ dynasty screens)
let mode = 'arcade'; // arcade | dynasty | practice — how a 'playing' game scores and ends
let curCpuLevel = 0; // effective CPU level for the game in progress (set at startGame)

// ============================================================ title menu
// Entries are appended by the sections that implement them (dynasty, practice,
// hoop styles) so the live site never shows a button for a mode that isn't built.
const MENU = [
  { label: () => 'ARCADE', run: () => { mode = 'arcade'; startGame(); } },
];
let menuSel = 0;
const menuRect = i => ({ x: CX - 140, y: 232 + i * 48, w: 280, h: 40 });
function menuMove(d) { menuSel = (menuSel + d + MENU.length) % MENU.length; }
function menuActivate() { MENU[menuSel].run(); }
let scores, timeLeft, suddenDeath, winner, hoopFlash, banner, tGlobal = 0;
let shake = 0; // screen-shake timer (dunks)
let boardData = null, myFinalScore = 0, myEntry = null, submitting = false; // leaderboard flow
let sessionScore = 0, entryOpen = false; // run total across games; entry shows when a loss ends the run

const players = [0, 1].map(i => ({
  team: i, x: 0, y: 0, vx: 0, vy: 0, fx: i === 0 ? 1 : -1, grounded: true,
  w: 40, h: 50, streak: 0, fireShots: 0, stealCd: 0,
  shootT: 0, jumpT: 0, runT: 0, // animation timers
  dunk: null, // in-flight dunk state
}));

const ball = {
  mode: 'loose', // loose | held | flight
  x: CX, y: FLOOR - 8, vx: 0, vy: 0,
  holder: null, flight: null,
};

const standY = p => FLOOR - p.h / 2;

function resetPlayerState(p) {
  p.vx = 0; p.vy = 0; p.streak = 0; p.fireShots = 0; p.stealCd = 0;
  p.fx = p.team === 0 ? 1 : -1; p.grounded = true;
  p.shootT = 0; p.jumpT = 0; p.runT = 0;
  p.dunk = null;
}

function tipOff() {
  players[0].x = 300; players[1].x = 540;
  players.forEach(p => {
    p.y = standY(p); p.vx = 0; p.vy = 0; p.grounded = true; p.stealCd = 0.3;
  });
  // P1 starts with the ball
  ball.mode = 'held'; ball.holder = players[0]; ball.flight = null;
  ball.vx = 0; ball.vy = 0;
}

function startGame() {
  if (mode === 'arcade') pickArcadeOpponent();
  rollName(TEAMS[0]); // both slots roll from whoever's pool occupies them
  rollName(TEAMS[1]);
  // one regeneration path for every mode: name decides the face, team decides the kit
  const jh = nameHash(TEAMS[0].playerName);
  SPRITES[0] = makeSpriteSet(0, JAM_SKINS[jh % 3], JAM_HAIR[((jh / 3) | 0) % 3], faceFor(TEAMS[0].playerName));
  SPRITES[1] = makeSpriteSet(1, TEAMS[1].skin || '#8D5524', TEAMS[1].hair || 'hitop', faceFor(TEAMS[1].playerName));
  scores = [0, 0];
  timeLeft = GAME_TIME;
  suddenDeath = false;
  winner = null;
  hoopFlash = 0;
  banner = null;
  shake = 0;
  players.forEach(resetPlayerState);
  cpu.decideT = 0; cpu.dir = 0; cpu.wantSteal = false; cpu.shootAt = -1;
  curCpuLevel = mode === 'dynasty' ? dynastyLevel() : cpuLevel;
  players[1].maxMul = cpuSkill(curCpuLevel).speed;
  tipOff();
  state = 'playing';
}

function endGame(teamIdx) {
  winner = teamIdx;
  playBuzzer();
  if (mode === 'dynasty') { endDynastyGame(teamIdx); return; } // dynasty owns its outcome
  // arcade: leveling ladder + run-based leaderboard (practice never calls endGame)
  state = 'over';
  if (teamIdx === 0) cpuLevel = Math.min(8, cpuLevel + 1); // beat the CPU and it comes back sharper
  sessionScore += scores[0];
  entryOpen = teamIdx === 1; // a loss ends the run — post the session total
  if (entryOpen) {
    showInitialsEntry(sessionScore); // the one leaderboard integration point
    sessionScore = 0; // next run starts fresh
  }
}

// dynasty hooks — replaced by the dynasty section; stubs keep the fork total
function dynastyLevel() { return cpuLevel; }
function endDynastyGame(teamIdx) { state = 'over'; }

// ---- leaderboard flow -------------------------------------------------------
const iniInput = document.getElementById('ini');
iniInput.addEventListener('input', () => {
  iniInput.value = iniInput.value.toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 3);
});

function showInitialsEntry(score) {
  myFinalScore = clamp(Math.round(score), 0, SCORE_CAP);
  myEntry = null;
  submitting = false;
  iniInput.value = '';
  setTimeout(() => iniInput.focus(), 50); // desktop gets the caret; mobile taps the slots
}

async function submitInitials() {
  if (submitting || state !== 'over') return;
  const name = iniInput.value;
  if (!/^[A-Z0-9]{1,3}$/.test(name)) { iniInput.focus(); return; }
  submitting = true;
  const res = await Leaderboard.submitScore(name, myFinalScore);
  submitting = false;
  if (res.row) myEntry = res.row;
  openBoard();
}

function openBoard() {
  state = 'board';
  boardData = null;
  iniInput.blur();
  Leaderboard.fetchTopScores(10).then(res => { boardData = res; });
}

function showBanner(text, dur = 2) { banner = { text, t: dur }; }

// ============================================================ audio (procedural, Web Audio API)
let AC = null;
function initAudio() {
  if (!AC) {
    try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { AC = null; }
  }
  if (AC && AC.state === 'suspended') AC.resume();
}
function tone(f0, f1, dur, type, vol, delay) {
  if (!AC) return;
  const t0 = AC.currentTime + (delay || 0);
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type || 'sine';
  o.frequency.setValueAtTime(f0, t0);
  if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(Math.max(f1, 1), t0 + dur);
  g.gain.setValueAtTime(vol || 0.2, t0);
  g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
  o.connect(g); g.connect(AC.destination);
  o.start(t0); o.stop(t0 + dur + 0.05);
}
function noiseBurst(dur, vol, freq) {
  if (!AC) return;
  const n = Math.floor(AC.sampleRate * dur);
  const buf = AC.createBuffer(1, n, AC.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
  const src = AC.createBufferSource(); src.buffer = buf;
  const f = AC.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = 0.8;
  const g = AC.createGain(); g.gain.value = vol;
  src.connect(f); f.connect(g); g.connect(AC.destination);
  src.start();
}
const playScore  = () => tone(523.25, 783.99, 0.35, 'triangle', 0.3);      // C5 -> G5 sweep
const playSteal  = () => tone(700, 180, 0.16, 'sawtooth', 0.18);           // descending sting
const playFire   = () => noiseBurst(0.4, 0.35, 1800);                      // sizzle
const playBuzzer = () => tone(180, 180, 1.3, 'square', 0.25);              // flat buzzer
const playRim    = () => tone(150, 90, 0.09, 'square', 0.15);              // clank
const playBlock  = () => tone(260, 70, 0.12, 'square', 0.22);              // swat
const playDunk   = () => { tone(100, 35, 0.35, 'square', 0.4); noiseBurst(0.3, 0.45, 240); }; // slam
const playBounce = () => tone(120, 80, 0.05, 'sine', 0.07);

// ============================================================ input
const keys = {};
const ALL_KEYS = new Set();
Object.values(CONTROLS).forEach(k => ALL_KEYS.add(k));
['Space', 'Enter'].forEach(k => ALL_KEYS.add(k));

window.addEventListener('keydown', e => {
  if (ALL_KEYS.has(e.code)) e.preventDefault();
  initAudio();
  switch (state) {
    case 'title':
      if (e.code === 'KeyH') { state = 'help'; return; }
      if (e.code === 'KeyL') { openBoard(); return; }
      if (e.code === 'ArrowUp') { menuMove(-1); return; }
      if (e.code === 'ArrowDown') { menuMove(1); return; }
      if (e.code === 'Enter' || e.code === 'Space') { menuActivate(); return; }
      return; // the menu is deliberate — stray keys no longer tip off
    case 'help':
      state = 'title'; return;
    case 'over':
      if (entryOpen) { if (e.code === 'Enter') submitInitials(); return; } // letters flow into the hidden input
      if (e.code === 'Enter' || e.code === 'Space') startGame();
      return;
    case 'board':
      if (e.code === 'Enter' || e.code === 'Space') startGame();
      return;
    case 'paused':
      if (e.code === 'KeyQ') { state = 'title'; return; }
      if (!e.repeat) state = 'playing'; // any other key resumes
      return;
    case 'playing':
      keys[e.code] = true;
      if (!e.repeat) {
        if (e.code === 'KeyP' || e.code === 'Escape') { state = 'paused'; return; }
        if (e.code === CONTROLS.action) doAction(players[0]);
        if (e.code === CONTROLS.up && players[0].grounded) players[0].vy = -JUMP_V; // real jump
      }
      return;
    default:
      return; // unlisted screens ignore input — new states fail inert, never as "playing"
  }
});
window.addEventListener('keyup', e => { keys[e.code] = false; });

canvas.addEventListener('click', e => {
  initAudio();
  const r = canvas.getBoundingClientRect();
  const mx = (e.clientX - r.left) * (W / r.width);
  const my = (e.clientY - r.top) * (H / r.height);
  const hit = (r) => mx >= r.x && mx <= r.x + r.w && my >= r.y && my <= r.y + r.h;
  if (state === 'title') {
    if (hit(helpRect())) { state = 'help'; return; }
    if (hit(boardRect())) { openBoard(); return; }
    for (let i = 0; i < MENU.length; i++) {
      if (hit(menuRect(i))) { menuSel = i; menuActivate(); return; }
    }
    return; // tapping empty title space does nothing
  }
  if (state === 'help') { state = 'title'; return; }
  if (state === 'over') {
    if (entryOpen) {
      if (hit(goRect())) { submitInitials(); return; }
      if (hit(skipRect())) { openBoard(); return; }
      iniInput.focus(); // tap anywhere else = summon the keyboard (needed on mobile)
      return;
    }
    if (hit(overPlayRect())) startGame();
    return;
  }
  if (state === 'board') {
    if (hit(playAgainRect())) startGame();
    return;
  }
  if (state === 'playing') {
    if (hit(pauseBtnRect())) state = 'paused';
    return;
  }
  if (state === 'paused') {
    if (hit(quitRect())) { state = 'title'; return; }
    state = 'playing'; // tap anywhere else resumes
  }
});

// ============================================================ touch controls (mobile)
const touchPanel = document.getElementById('touch');
if (location.search.includes('touch')) touchPanel.classList.add('on');
window.addEventListener('touchstart', () => touchPanel.classList.add('on'), { once: true, passive: true });

function touchPress(btn, fn) {
  initAudio();
  switch (state) {
    case 'playing': fn(); return;
    case 'paused': state = 'playing'; return; // any touch button resumes
    case 'title': // D-pad walks the menu, action selects — no accidental tip-offs
      if (btn === 'L' || btn === 'J') menuMove(-1);
      else if (btn === 'R') menuMove(1);
      else if (btn === 'A') menuActivate();
      return;
    case 'help': state = 'title'; return;
    case 'board': startGame(); return;
    case 'over': if (!entryOpen) startGame(); return; // initials screen: use the on-canvas buttons
    default: return; // unlisted screens ignore touch buttons — new states fail inert
  }
}
function bindTouch(el, onDown, onUp) {
  el.addEventListener('pointerdown', e => { e.preventDefault(); onDown(); });
  ['pointerup', 'pointercancel', 'pointerleave'].forEach(ev =>
    el.addEventListener(ev, e => { e.preventDefault(); if (onUp) onUp(); }));
}
bindTouch(document.getElementById('tL'),
  () => touchPress('L', () => { keys[CONTROLS.left] = true; }),
  () => { keys[CONTROLS.left] = false; });
bindTouch(document.getElementById('tR'),
  () => touchPress('R', () => { keys[CONTROLS.right] = true; }),
  () => { keys[CONTROLS.right] = false; });
bindTouch(document.getElementById('tJ'),
  () => touchPress('J', () => { if (players[0].grounded) players[0].vy = -JUMP_V; }));
bindTouch(document.getElementById('tA'),
  () => touchPress('A', () => doAction(players[0])));

// ============================================================ actions
function doAction(p) {
  if (ball.mode === 'held' && ball.holder === p) shoot(p);
  else trySteal(p);
}

// DUNK: airborne inside the arc with a clear lane -> fly to the rim and slam
function defenderInLane(p) {
  const opp = players[1 - p.team];
  const x1 = p.x, y1 = p.y, x2 = HOOP.x - 20, y2 = HOOP.y;
  const ddx = x2 - x1, ddy = y2 - y1;
  const len2 = ddx * ddx + ddy * ddy;
  if (len2 < 1) return false;
  const t = clamp(((opp.x - x1) * ddx + (opp.y - y1) * ddy) / len2, 0, 1);
  if (t < 0.15) return false; // defender behind the take-off point doesn't deny
  return Math.hypot(opp.x - (x1 + ddx * t), opp.y - (y1 + ddy * t)) < 55;
}

function startDunk(p) {
  const make = p.fireShots > 0 || Math.random() < 0.9; // flushes most of the time
  p.dunk = { t: 0, dur: 0.45, sx: p.x, sy: p.y, tx: HOOP.x - 22, ty: HOOP.y - 6, make };
  p.fx = 1; // face the hoop
  p.jumpT = 0;
}

function reachRim(p) { // dunk flight arrives at the rim
  const d = p.dunk;
  if (d.make) {
    // SLAM: effects hit now, the ball drops through, and the dunker hangs on the rim
    d.fire = p.fireShots > 0;
    d.hang = 0.55;
    playDunk();
    shake = 0.35;
    hoopFlash = 0.6;
    showBanner(TEAMS[p.team].playerName + ' THROWS IT DOWN!', 1.6);
    ball.mode = 'loose'; ball.holder = null;
    ball.x = HOOP.x; ball.y = HOOP.y + 12; ball.vx = 0; ball.vy = 160;
  } else {
    // clanked dunk: no hang, straight off the iron
    p.dunk = null;
    p.vy = 40;
    shake = 0.15;
    ball.holder = null;
    resolveMiss({ shooter: p });
  }
}

function finishDunk(p) { // lets go of the rim; the bucket counts now
  const fire = p.dunk.fire;
  p.dunk = null;
  p.vy = 120;
  resolveMake({ shooter: p, pts: 2, fire, make: true, dunk: true, effectsDone: true });
}

function shoot(p) {
  if (!p.grounded && !p.dunk && p.x < HOOP.x - 26 &&
      Math.abs(ball.x - HOOP.x) < THREE_X && !defenderInLane(p)) {
    startDunk(p);
    return;
  }

  const dx = HOOP.x - ball.x, dy = HOOP.y - ball.y;
  const d = Math.hypot(dx, dy);

  // proximity + angle + motion -> make probability (jumping shortens d = better shot)
  let prob = clamp(1.3 - d / 300, 0.15, 0.95);
  if (p.x > HOOP.x) prob *= 0.4; // behind the backboard
  prob *= 1 - 0.2 * (Math.abs(p.vx) / MAX_SPEED);

  const fire = p.fireShots > 0;
  if (fire) prob = 1;

  const make = Math.random() < prob;
  const pts = Math.abs(ball.x - HOOP.x) > THREE_X ? 3 : 2; // floor 3-pt line

  p.shootT = 0.45; // shoot animation: windup then release
  ball.mode = 'flight';
  ball.holder = null;
  ball.flight = {
    t: 0,
    dur: 0.5 + d / 650,
    sx: ball.x, sy: ball.y,
    tx: make ? HOOP.x : HOOP.x - HOOP.rimHalf,   // make: through the middle; miss: front iron
    ty: HOOP.y,
    peak: 60 + d * 0.22,
    make, pts, fire,
    shooter: p,
  };
}

function trySteal(p) {
  if (p.stealCd > 0) return;
  p.stealCd = 0.8;
  p.jumpT = 0.3; // lunge animation on every attempt
  if (ball.mode !== 'held' || ball.holder.team === p.team || ball.holder.dunk) return; // can't strip a dunker
  const carrier = ball.holder;
  if (Math.hypot(p.x - carrier.x, p.y - carrier.y) > 64) return;
  if (Math.random() < 0.4) {
    ball.holder = p;
    playSteal();
    showBanner(TEAMS[p.team].playerName + ' STEALS!', 1.2);
  }
}

// ============================================================ CPU opponent (P2)
// The arcade CPU starts rusty and levels up each time the player beats it.
let cpuLevel = 0;
function cpuSkill(level) {
  // Piecewise ramps: identical to the original curve through ~Lv.5, then a gentler
  // climb so higher levels keep differentiating (dynasty world stage + Olympics, up to 14).
  const ext = Math.max(0, level - 5);
  return {
    delay: Math.max(0.06, Math.max(0.15, 0.45 - level * 0.06) - ext * 0.01), // reaction delay between decisions
    range: Math.min(380, Math.min(300, 170 + level * 25) + ext * 9),         // shooting range: 2D distance to rim
    stealDist: Math.min(75, Math.min(61, 37 + level * 5) + ext * 1.6),       // how close he must be to pickpocket
    speed: Math.min(1.12, Math.min(1, 0.72 + level * 0.06) + ext * 0.013),   // top-speed multiplier
  };
}
const cpu = { decideT: 0, dir: 0, wantSteal: false, shootAt: -1 };

function cpuThink() {
  const p = players[1];
  const skill = cpuSkill(curCpuLevel);
  cpu.dir = 0;
  if (ball.holder === p) {
    // in possession: attack the hoop, launch when in range
    if (p.x > HOOP.x - 20) { cpu.dir = -1; return; } // get back in front of the rim
    const d = Math.hypot(HOOP.x - ball.x, HOOP.y - ball.y);
    if (d < skill.range) {
      if (p.grounded && cpu.shootAt < 0) { p.vy = -JUMP_V; cpu.shootAt = 0.18; } // rise for a jumper
    } else {
      cpu.dir = 1;
    }
  } else if (ball.mode !== 'flight') {
    // no possession: pursue the ball, loose or carried
    const dx = ball.x - p.x;
    if (Math.abs(dx) > 14) cpu.dir = Math.sign(dx);
    if (ball.mode === 'held' && ball.holder.team === 0 && p.stealCd <= 0 &&
        Math.hypot(p.x - ball.holder.x, p.y - ball.holder.y) < skill.stealDist) {
      cpu.wantSteal = true;
    }
  }
}

function cpuUpdate(dt) {
  const p = players[1];
  cpu.decideT -= dt;
  if (cpu.decideT <= 0) { cpu.decideT = cpuSkill(curCpuLevel).delay; cpuThink(); }
  if (cpu.shootAt >= 0) {
    cpu.shootAt -= dt;
    if (cpu.shootAt < 0) {
      if (ball.holder === p) shoot(p); // release near the top of the jump
      cpu.shootAt = -1;
    }
  }
  if (cpu.wantSteal) { cpu.wantSteal = false; trySteal(p); }
}

// ============================================================ scoring / resolution
function resolveMake(f) {
  const t = f.shooter.team;
  scores[t] += f.pts;
  if (f.dunk) {
    if (!f.effectsDone) {
      hoopFlash = 0.6;
      playDunk();
      showBanner(TEAMS[t].playerName + ' THROWS IT DOWN!', 1.5);
    }
  } else {
    hoopFlash = 0.6;
    playScore();
    if (f.pts === 3) showBanner('THREE POINTER!', 1.2);
  }

  const p = f.shooter;
  if (f.fire) {
    p.fireShots--;
    if (p.fireShots <= 0) { p.fireShots = 0; p.streak = 0; }
  } else {
    p.streak++;
    if (p.streak >= 2) {
      p.fireShots = 3;
      playFire();
      showBanner(TEAMS[t].playerName + ' IS ON FIRE! \u{1F525}', 2);
    }
  }

  if (suddenDeath || scores[t] >= WIN_SCORE) { endGame(t); return; }

  resetAfterScore(1 - t);
}

function resolveMiss(f) {
  f.shooter.streak = 0;
  playRim();
  // rebound: ball caroms off the front iron back into the court
  ball.mode = 'loose';
  ball.x = HOOP.x - HOOP.rimHalf - 4;
  ball.y = HOOP.y - 6;
  ball.vx = -(80 + Math.random() * 150);
  ball.vy = -(60 + Math.random() * 130);
}

function resetAfterScore(concederIdx) {
  const c = players[concederIdx];
  const s = players[1 - concederIdx];
  // check-ball: conceder takes it out past the 3-pt line, scorer defends the lane
  c.x = 340; s.x = 560;
  [c, s].forEach(p => { p.y = standY(p); p.vx = 0; p.vy = 0; p.grounded = true; });
  s.stealCd = 0.6; // brief inbound immunity
  ball.mode = 'held'; ball.holder = c; ball.flight = null;
  ball.vx = 0; ball.vy = 0;
}

// ============================================================ update
function update(dt) {
  tGlobal += dt;
  if (state !== 'playing') return; // pause freezes everything below, banners included
  if (banner) { banner.t -= dt; if (banner.t <= 0) banner = null; }

  hoopFlash = Math.max(0, hoopFlash - dt);
  shake = Math.max(0, shake - dt);

  cpuUpdate(dt);
  updatePlayer(players[0], (keys[CONTROLS.right] ? 1 : 0) - (keys[CONTROLS.left] ? 1 : 0), dt);
  updatePlayer(players[1], cpu.dir, dt);
  updateBall(dt);

  // clock
  if (!suddenDeath) {
    timeLeft = Math.max(0, timeLeft - dt);
    if (timeLeft <= 0 && ball.mode !== 'flight' && !players[0].dunk && !players[1].dunk) { // let buzzer-beaters resolve
      if (scores[0] === scores[1]) {
        suddenDeath = true;
        playBuzzer();
        showBanner('OVERTIME! NEXT BASKET WINS', 2.5);
        tipOff();
      } else {
        endGame(scores[0] > scores[1] ? 0 : 1);
      }
    }
  }
}

function updatePlayer(p, ax, dt) {
  p.stealCd = Math.max(0, p.stealCd - dt);
  p.shootT = Math.max(0, p.shootT - dt);
  p.jumpT = Math.max(0, p.jumpT - dt);

  // dunk flight overrides normal physics: carried to the rim on an arc
  if (p.dunk) {
    const d = p.dunk;
    p.vx = 0; p.vy = 0; p.grounded = false;
    if (d.hang !== undefined) {
      // hanging on the rim
      d.hang -= dt;
      p.x = d.tx;
      p.y = d.ty + Math.sin(tGlobal * 9) * 2.5;
      if (d.hang <= 0) finishDunk(p);
      return;
    }
    d.t += dt;
    const u = Math.min(1, d.t / d.dur);
    p.x = d.sx + (d.tx - d.sx) * u;
    p.y = d.sy + (d.ty - d.sy) * u - 46 * Math.sin(Math.PI * u);
    if (u >= 1) reachRim(p);
    return;
  }

  // horizontal: accel + friction (less control in the air)
  p.vx += ax * ACCEL * (p.grounded ? 1 : 0.55) * dt;
  p.vx *= Math.max(0, 1 - (p.grounded ? FRICTION : 1.2) * dt);
  const max = (ball.holder === p ? CARRIER_SPEED : 1) * MAX_SPEED * (p.maxMul || 1);
  if (Math.abs(p.vx) > max) p.vx = Math.sign(p.vx) * max;
  p.x += p.vx * dt;
  if (p.x < COURT.left + p.w / 2) { p.x = COURT.left + p.w / 2; p.vx = 0; }
  if (p.x > COURT.right - p.w / 2) { p.x = COURT.right - p.w / 2; p.vx = 0; }

  // vertical: gravity, land on the ground plane
  p.vy += GRAV * dt;
  p.y += p.vy * dt;
  const sy = standY(p);
  if (p.y >= sy) { p.y = sy; p.vy = 0; p.grounded = true; }
  else p.grounded = false;

  if (Math.abs(p.vx) > 15) p.fx = Math.sign(p.vx);
  if (p.grounded && Math.abs(p.vx) > 40) p.runT += dt;
  else if (p.grounded) p.runT = 0;
}

function updateBall(dt) {
  if (ball.mode === 'held') {
    const h = ball.holder;
    if (h.dunk) { ball.x = h.x + h.fx * 10; ball.y = h.y - 34; return; } // ball cocked overhead
    ball.x = h.x + h.fx * 26;
    ball.y = h.y - 3;
    return;
  }

  if (ball.mode === 'flight') {
    const f = ball.flight;
    f.t += dt;
    const u = Math.min(1, f.t / f.dur);
    ball.x = f.sx + (f.tx - f.sx) * u;
    ball.y = f.sy + (f.ty - f.sy) * u - f.peak * Math.sin(Math.PI * u); // real arc over the rim

    // BLOCK: an airborne defender who meets the rising ball swats it loose.
    // Fire shots are unblockable — 100% means 100%.
    if (!f.fire && u > 0.08 && u < 0.55) {
      for (const p of players) {
        if (p === f.shooter || p.grounded) continue;
        if (Math.hypot(p.x - ball.x, (p.y - 15) - ball.y) < 34) {
          ball.mode = 'loose';
          ball.flight = null;
          ball.vx = (p.x < HOOP.x ? -1 : 1) * (150 + Math.random() * 150); // swat away from the hoop
          ball.vy = -(20 + Math.random() * 120);
          f.shooter.streak = 0;
          playBlock();
          showBanner(TEAMS[p.team].playerName + ' WITH THE BLOCK!', 1.5);
          return;
        }
      }
    }

    if (u >= 1) {
      ball.flight = null;
      if (f.make) resolveMake(f); else resolveMiss(f);
    }
    return;
  }

  // loose: projectile physics
  ball.vy += BALL_GRAV * dt;
  ball.x += ball.vx * dt;
  ball.y += ball.vy * dt;
  const rest = FLOOR - 8;
  if (ball.y > rest) {
    ball.y = rest;
    if (ball.vy > 90) { ball.vy = -ball.vy * 0.55; playBounce(); }
    else ball.vy = 0;
  }
  const rolling = ball.y >= rest - 0.5 && ball.vy === 0;
  ball.vx *= Math.max(0, 1 - (rolling ? 1.8 : 0.15) * dt);
  if (ball.x < COURT.left + 8) { ball.x = COURT.left + 8; ball.vx = -ball.vx * 0.7; }
  if (ball.x > BB_X - 8) { ball.x = BB_X - 8; ball.vx = -ball.vx * 0.7; }

  // pickup on contact
  for (const p of players) {
    if (Math.hypot(p.x - ball.x, p.y - ball.y) < 40) {
      ball.mode = 'held'; ball.holder = p;
      ball.vx = 0; ball.vy = 0;
      break;
    }
  }
}

// ============================================================ render helpers
function rrect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

// ============================================================ render
function render() {
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = '#0A1628';
  ctx.fillRect(0, 0, W, H);

  if (state === 'title') { renderTitle(); return; }
  if (state === 'help') { renderHelp(); return; }
  if (state === 'board') { renderBoard(); return; }
  if (state !== 'playing' && state !== 'paused' && state !== 'over') return; // unknown state: blank frame, never the court

  ctx.save();
  if (shake > 0) ctx.translate((Math.random() - 0.5) * 14 * shake, (Math.random() - 0.5) * 10 * shake);

  renderCourt();
  renderHUD();

  // ground shadows (shrink with height)
  const ballH = clamp(1 - (FLOOR - 8 - ball.y) / 300, 0.35, 1);
  renderShadow(ball.x, FLOOR + 4, 10 * ballH + 3, 4, 0.35 * ballH);
  players.forEach(p => {
    const k = clamp(1 - (standY(p) - p.y) / 200, 0.45, 1);
    renderShadow(p.x, FLOOR + 5, 26 * k, 7, 0.3 * k);
  });

  players.forEach(renderPlayer);
  renderBall();
  renderHoop(); // rim + net render in front of the ball

  if (banner && banner.text) renderBanner();
  if (state === 'over') renderWin();
  if (state === 'paused') renderPause();
  ctx.restore();
}

function renderPause() {
  ctx.fillStyle = 'rgba(10,22,40,0.82)';
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = 'bold 52px Arial, sans-serif';
  ctx.fillStyle = '#FFD700';
  ctx.fillText('PAUSED', CX, 190);

  const r = resumeRect(), q = quitRect();
  ctx.fillStyle = '#009B3A';
  rrect(r.x, r.y, r.w, r.h, 10); ctx.fill();
  ctx.lineWidth = 3;
  ctx.strokeStyle = '#FFD700';
  ctx.stroke();
  ctx.font = 'bold 17px Arial, sans-serif';
  ctx.fillStyle = '#FFFFFF';
  ctx.fillText('RESUME', r.x + r.w / 2, r.y + r.h / 2);
  ctx.strokeStyle = 'rgba(154,176,200,0.7)';
  ctx.lineWidth = 2;
  rrect(q.x, q.y, q.w, q.h, 10); ctx.stroke();
  ctx.fillStyle = '#9AB0C8';
  ctx.fillText('QUIT  [Q]', q.x + q.w / 2, q.y + q.h / 2);

  ctx.font = '13px "Courier New", monospace';
  ctx.fillStyle = '#9AB0C8';
  ctx.fillText('any key or tap resumes', CX, 240);
}

function renderShadow(x, y, rx, ry, alpha) {
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.fillStyle = '#000';
  ctx.beginPath();
  ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

function renderCourt() {
  // stands backdrop
  ctx.fillStyle = '#0D1B2E';
  ctx.fillRect(0, 90, W, 312);
  // crowd pixels (deterministic, no flicker)
  const pal = ['#22344E', '#2E4A63', '#3C2E52', '#233F35', '#4A3A28'];
  for (let ry = 0; ry < 6; ry++) {
    for (let cx = 0; cx < 46; cx++) {
      const seed = (cx * 31 + ry * 57) % 97;
      if (seed % 3 === 0) continue;
      ctx.fillStyle = pal[seed % 5];
      ctx.fillRect(10 + cx * 17 + (ry % 2) * 8, 112 + ry * 46, 6, 6);
    }
  }
  // courtside ad board
  ctx.fillStyle = '#081120';
  ctx.fillRect(0, 402, W, FLOOR - 402);
  ctx.font = 'bold 15px "Courier New", monospace';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = 'rgba(255,215,0,0.35)';
  ctx.fillText('★ JA JAM ★', 150, 421);
  ctx.fillStyle = 'rgba(0,194,221,0.35)';
  ctx.fillText('★ JA JAM ★', 400, 421);
  ctx.fillStyle = 'rgba(255,215,0,0.35)';
  ctx.fillText('★ JA JAM ★', 650, 421);

  // hardwood floor band
  ctx.fillStyle = '#C8A96E';
  ctx.fillRect(0, FLOOR, W, 30);
  for (let x = 0; x < W; x += 40) {
    ctx.fillStyle = (x / 40) % 2 ? 'rgba(0,0,0,0.05)' : 'rgba(255,255,255,0.04)';
    ctx.fillRect(x, FLOOR, 40, 30);
  }
  ctx.strokeStyle = '#FFFFFF';
  ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(0, FLOOR + 1.5); ctx.lineTo(W, FLOOR + 1.5); ctx.stroke();

  // floor markings: 3-pt line + check-ball circle
  const tx = HOOP.x - THREE_X;
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(tx, FLOOR + 3); ctx.lineTo(tx, FLOOR + 28); ctx.stroke();
  ctx.font = 'bold 10px "Courier New", monospace';
  ctx.fillStyle = '#FFFFFF';
  ctx.fillText('3PT', tx - 14, FLOOR + 14);
  ctx.save();
  ctx.globalAlpha = 0.5;
  ctx.beginPath(); ctx.ellipse(340, FLOOR + 15, 40, 8, 0, 0, Math.PI * 2); ctx.stroke();
  ctx.restore();
}

function renderHoop() {
  // wall arm + backboard
  ctx.fillStyle = '#33414F';
  ctx.fillRect(BB_X + 6, 209, W - BB_X - 6, 8);
  ctx.fillStyle = '#E8E8E8';
  ctx.fillRect(BB_X, 187, 6, 92);
  ctx.fillStyle = '#B8B8B8';
  ctx.fillRect(BB_X - 4, 263, 4, 8); // rim bracket
  // rim
  ctx.fillStyle = '#FF4500';
  ctx.fillRect(HOOP.x - HOOP.rimHalf, HOOP.y - 2, HOOP.rimHalf * 2 + 1, 4);
  // net
  ctx.strokeStyle = 'rgba(255,255,255,0.55)';
  ctx.lineWidth = 1;
  for (let i = 0; i <= 4; i++) {
    const nx = HOOP.x - HOOP.rimHalf + 3 + i * (HOOP.rimHalf * 2 - 6) / 4;
    const cx2 = HOOP.x + (nx - HOOP.x) * 0.45;
    ctx.beginPath(); ctx.moveTo(nx, HOOP.y + 2); ctx.lineTo(cx2, HOOP.y + 24); ctx.stroke();
  }
  ctx.beginPath(); ctx.moveTo(HOOP.x - HOOP.rimHalf * 0.55, HOOP.y + 24);
  ctx.lineTo(HOOP.x + HOOP.rimHalf * 0.55, HOOP.y + 24); ctx.stroke();
  // score flash
  if (hoopFlash > 0) {
    const k = 1 - hoopFlash / 0.6;
    ctx.save();
    ctx.globalAlpha = 1 - k;
    ctx.strokeStyle = '#FFD700';
    ctx.lineWidth = 5;
    ctx.beginPath(); ctx.arc(HOOP.x, HOOP.y, 14 + k * 34, 0, Math.PI * 2); ctx.stroke();
    ctx.restore();
  }
}

function spriteFor(p) {
  const s = p.fireShots > 0 ? SPRITES[p.team].fire : SPRITES[p.team].norm;
  if (p.dunk) return s.shoot[1]; // full-extension slam pose for the whole flight
  if (p.shootT > 0) return s.shoot[p.shootT > 0.3 ? 0 : 1]; // windup, then release
  if (!p.grounded || p.jumpT > 0) return s.jump[0];
  if (Math.abs(p.vx) > 40) return s.run[Math.floor(p.runT * 10) % 4];
  return s.idle[Math.floor(tGlobal * 2.5) % 2];
}

function renderPlayer(p) {
  const team = TEAMS[p.team];

  // fire glow
  if (p.fireShots > 0) {
    const flick = 0.55 + 0.45 * Math.sin(tGlobal * 18 + p.team * 3);
    const g = ctx.createRadialGradient(p.x, p.y - 7, 8, p.x, p.y - 7, 56);
    g.addColorStop(0, 'rgba(255,140,0,' + (0.65 * flick) + ')');
    g.addColorStop(1, 'rgba(255,60,0,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(p.x, p.y - 7, 56, 0, Math.PI * 2); ctx.fill();
  }

  // pixel-art body: sprite bottom rides the player's feet (real jump arc shows)
  const spr = spriteFor(p);
  const footY = p.y + p.h / 2;
  const dx = Math.round(p.x - SPRITE_SIZE / 2);
  const dy = Math.round(footY - SPRITE_SIZE);
  if (p.fx < 0) {
    ctx.save();
    ctx.scale(-1, 1);
    ctx.drawImage(spr, -dx - SPRITE_SIZE, dy, SPRITE_SIZE, SPRITE_SIZE);
    ctx.restore();
  } else {
    ctx.drawImage(spr, dx, dy, SPRITE_SIZE, SPRITE_SIZE);
  }

  // name label
  const labelY = footY - SPRITE_SIZE - 8;
  ctx.font = 'bold 11px "Courier New", monospace';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.lineWidth = 3;
  ctx.strokeStyle = 'rgba(0,0,0,0.7)';
  ctx.strokeText(team.playerName, p.x, labelY);
  ctx.fillStyle = '#FFF';
  ctx.fillText(team.playerName, p.x, labelY);
  if (p.fireShots > 0) {
    ctx.fillText('\u{1F525}', p.x, labelY - 14);
  }
}

function renderBall() {
  const r = 8;
  const bx = ball.x, by = ball.y;
  ctx.fillStyle = '#FF6B00';
  ctx.beginPath(); ctx.arc(bx, by, r, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = '#000';
  ctx.lineWidth = 1.2;
  ctx.stroke();
  // seams
  ctx.save();
  ctx.beginPath(); ctx.arc(bx, by, r, 0, Math.PI * 2); ctx.clip();
  ctx.beginPath();
  ctx.moveTo(bx - r, by); ctx.lineTo(bx + r, by);
  ctx.moveTo(bx, by - r); ctx.lineTo(bx, by + r);
  ctx.arc(bx - r * 0.9, by, r * 0.9, -0.9, 0.9);
  ctx.arc(bx + r * 0.9, by, r * 0.9, Math.PI - 0.9, Math.PI + 0.9);
  ctx.stroke();
  ctx.restore();
}

function renderHUD() {
  ctx.textBaseline = 'middle';
  // scores: drawn flags + ASCII text (emoji inside aligned strings clips on mobile)
  const FW = 30, FH = 19, FY = 42 - FH / 2;
  drawJamFlag(48, FY, FW, FH);
  (TEAMS[1].drawFlag || drawBahFlag)(W - 48 - FW, FY, FW, FH);
  ctx.font = 'bold 30px "Courier New", monospace';
  ctx.textAlign = 'left';
  ctx.fillStyle = TEAMS[0].accent;
  ctx.fillText(TEAMS[0].abbr + '  ' + scores[0], 48 + FW + 10, 42);
  ctx.textAlign = 'right';
  ctx.fillStyle = TEAMS[1].accent;
  ctx.fillText(scores[1] + '  ' + TEAMS[1].abbr, W - 48 - FW - 10, 42);
  // timer
  ctx.textAlign = 'center';
  ctx.font = 'bold 34px "Courier New", monospace';
  if (suddenDeath) {
    ctx.fillStyle = '#FF5050';
    ctx.fillText('OT', CX, 42);
  } else {
    const t = Math.ceil(timeLeft);
    const mm = Math.floor(t / 60), ss = ('0' + (t % 60)).slice(-2);
    ctx.fillStyle = timeLeft <= 10 ? '#FF5050' : '#FFFFFF';
    ctx.fillText(mm + ':' + ss, CX, 42);
  }
  // fire indicators
  ctx.font = 'bold 13px "Courier New", monospace';
  players.forEach((p, i) => {
    if (p.fireShots > 0) {
      ctx.fillStyle = '#FF8C00';
      ctx.textAlign = i === 0 ? 'left' : 'right';
      ctx.fillText('\u{1F525} ' + TEAMS[i].playerName + ' ON FIRE', i === 0 ? 48 : W - 48, 70);
    }
  });
  // pause button (tap or P)
  const pb = pauseBtnRect();
  ctx.strokeStyle = 'rgba(154,176,200,0.55)';
  ctx.lineWidth = 1.5;
  rrect(pb.x, pb.y, pb.w, pb.h, 6);
  ctx.stroke();
  ctx.fillStyle = 'rgba(154,176,200,0.8)';
  ctx.fillRect(pb.x + 17, pb.y + 7, 4, 12);
  ctx.fillRect(pb.x + 27, pb.y + 7, 4, 12);

  // controls legend + contextual touch action label
  const actLabel = (ball.mode === 'held' && ball.holder === players[0]) ? 'SHOOT' : 'STEAL';
  const btnA = document.getElementById('tA');
  if (btnA.textContent !== actLabel) btnA.textContent = actLabel;
  ctx.font = '12px "Courier New", monospace';
  ctx.fillStyle = '#9AB0C8';
  ctx.textAlign = 'left';
  const touchOn = getComputedStyle(touchPanel).display !== 'none';
  ctx.fillText(touchOn ? 'P1 • touch controls' : 'P1 • ←→ move • ↑ jump • SPACE shoot/steal • P pause', COURT.left, 486);
  ctx.textAlign = 'right';
  ctx.fillText(TEAMS[1].playerName + ' • CPU Lv.' + (cpuLevel + 1), COURT.right + 24, 486);
}

function renderBanner() {
  ctx.save();
  ctx.globalAlpha = clamp(banner.t / 0.4, 0, 1);
  ctx.font = 'bold 30px Arial, sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.lineWidth = 6;
  ctx.strokeStyle = 'rgba(0,0,0,0.75)';
  ctx.strokeText(banner.text, CX, 200);
  ctx.fillStyle = '#FFD700';
  ctx.fillText(banner.text, CX, 200);
  ctx.restore();
}

function renderStripes() {
  const stripes = ['#009B3A', '#FFD700', '#000000', '#00778B', '#FAD44D'];
  stripes.forEach((c, i) => {
    ctx.fillStyle = c;
    ctx.globalAlpha = 0.16;
    ctx.fillRect(0, 430 + i * 14, W, 14);
  });
  ctx.globalAlpha = 1;
}

// canvas-drawn flags — emoji metrics differ per platform, geometry doesn't
function drawJamFlag(x, y, w, h) { // gold saltire, green top/bottom, black hoist/fly
  ctx.fillStyle = '#009B3A'; ctx.fillRect(x, y, w, h);
  ctx.fillStyle = '#000';
  ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + w * 0.42, y + h / 2); ctx.lineTo(x, y + h); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(x + w, y); ctx.lineTo(x + w * 0.58, y + h / 2); ctx.lineTo(x + w, y + h); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = '#FFD700'; ctx.lineWidth = 2.5;
  ctx.beginPath();
  ctx.moveTo(x, y); ctx.lineTo(x + w, y + h);
  ctx.moveTo(x + w, y); ctx.lineTo(x, y + h);
  ctx.stroke();
  ctx.strokeStyle = 'rgba(255,255,255,0.25)'; ctx.lineWidth = 1;
  ctx.strokeRect(x + 0.5, y + 0.5, w - 1, h - 1);
}
function drawBahFlag(x, y, w, h) { // aqua-gold-aqua bands, black hoist triangle
  ctx.fillStyle = '#00778B'; ctx.fillRect(x, y, w, h);
  ctx.fillStyle = '#FAD44D'; ctx.fillRect(x, y + h / 3, w, h / 3);
  ctx.fillStyle = '#000';
  ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + w * 0.45, y + h / 2); ctx.lineTo(x, y + h); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.25)'; ctx.lineWidth = 1;
  ctx.strokeRect(x + 0.5, y + 0.5, w - 1, h - 1);
}

// --- shared flag primitives (all flags are geometry: emoji metrics differ per platform)
function flagBorder(x, y, w, h) {
  ctx.strokeStyle = 'rgba(255,255,255,0.25)'; ctx.lineWidth = 1;
  ctx.strokeRect(x + 0.5, y + 0.5, w - 1, h - 1);
}
function flagStripesH(x, y, w, h, cols) {
  const n = cols.length;
  cols.forEach((c, i) => { ctx.fillStyle = c; ctx.fillRect(x, y + h * i / n, w, h / n + 0.6); });
}
function flagStripesV(x, y, w, h, cols) {
  const n = cols.length;
  cols.forEach((c, i) => { ctx.fillStyle = c; ctx.fillRect(x + w * i / n, y, w / n + 0.6, h); });
}
function flagTri(x, y, w, h, frac, col) { // hoist triangle, apex at frac of the width
  ctx.fillStyle = col;
  ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + w * frac, y + h / 2); ctx.lineTo(x, y + h);
  ctx.closePath(); ctx.fill();
}
function flagStar(cx, cy, r, col) { // 5-point star
  ctx.fillStyle = col;
  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const ang = -Math.PI / 2 + i * Math.PI / 5;
    const rr = i % 2 ? r * 0.45 : r;
    const px = cx + Math.cos(ang) * rr, py = cy + Math.sin(ang) * rr;
    i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
  }
  ctx.closePath(); ctx.fill();
}

// --- Caribbean pool
function drawGuyFlag(x, y, w, h) { // green field, white-edged golden arrowhead, black-edged red hoist triangle
  ctx.fillStyle = '#009E49'; ctx.fillRect(x, y, w, h);
  flagTri(x, y, w, h, 1, '#FFFFFF');
  flagTri(x, y + 1.5, w, h - 3, 0.95, '#FCD116');
  flagTri(x, y, w, h, 0.54, '#000000');
  flagTri(x, y + 2, w, h - 4, 0.47, '#CE1126');
  flagBorder(x, y, w, h);
}
function drawIsvFlag(x, y, w, h) { // white field, gold eagle between blue V and I
  ctx.fillStyle = '#FFFFFF'; ctx.fillRect(x, y, w, h);
  ctx.fillStyle = '#FFD34D';
  ctx.fillRect(x + w * 0.44, y + h * 0.28, w * 0.12, h * 0.42); // eagle body
  ctx.fillRect(x + w * 0.29, y + h * 0.3, w * 0.15, h * 0.16);  // left wing
  ctx.fillRect(x + w * 0.56, y + h * 0.3, w * 0.15, h * 0.16);  // right wing
  ctx.strokeStyle = '#0033A0'; ctx.lineWidth = Math.max(1.5, w * 0.045);
  ctx.beginPath();
  ctx.moveTo(x + w * 0.07, y + h * 0.24); ctx.lineTo(x + w * 0.15, y + h * 0.76); ctx.lineTo(x + w * 0.23, y + h * 0.24);
  ctx.stroke();
  ctx.fillStyle = '#0033A0'; ctx.fillRect(x + w * 0.8, y + h * 0.24, Math.max(2, w * 0.055), h * 0.52);
  flagBorder(x, y, w, h);
}
function drawCubFlag(x, y, w, h) { // five blue/white stripes, red hoist triangle, white star
  flagStripesH(x, y, w, h, ['#002A8F', '#FFFFFF', '#002A8F', '#FFFFFF', '#002A8F']);
  flagTri(x, y, w, h, 0.45, '#CF142B');
  flagStar(x + w * 0.15, y + h / 2, h * 0.16, '#FFFFFF');
  flagBorder(x, y, w, h);
}
function drawDomFlag(x, y, w, h) { // white cross, blue/red quarters, tiny center arms
  ctx.fillStyle = '#FFFFFF'; ctx.fillRect(x, y, w, h);
  const bw = w * 0.42, bh = h * 0.37;
  ctx.fillStyle = '#002D62'; ctx.fillRect(x, y, bw, bh); ctx.fillRect(x + w - bw, y + h - bh, bw, bh);
  ctx.fillStyle = '#CE1126'; ctx.fillRect(x + w - bw, y, bw, bh); ctx.fillRect(x, y + h - bh, bw, bh);
  ctx.fillStyle = '#007A3D'; ctx.fillRect(x + w / 2 - 1.5, y + h / 2 - 2.5, 3, 5);

function renderTitle() {
  renderStripes();

  ctx.fillText('JA JAM', CX, 108);

  // matchup: centered ASCII text + canvas-drawn flags (identical on every platform)
  ctx.font = 'bold 19px Arial, sans-serif';
  ctx.fillStyle = '#FFFFFF';
  const matchup = 'JAMAICA  vs  ' + TEAMS[1].full.replace('TEAM ', '');
  ctx.fillText(matchup, CX, 176);
  const half = ctx.measureText(matchup).width / 2;
  const fw = 27, fh = 17;
  drawJamFlag(CX - half - 9 - fw, 176 - fh / 2, fw, fh);
  (TEAMS[1].drawFlag || drawBahFlag)(CX + half + 9, 176 - fh / 2, fw, fh);

  // vertical menu: arrows + Enter, tap, or touch D-pad + action button
  ctx.textBaseline = 'middle';
  MENU.forEach((m, i) => {
    const r = menuRect(i);
    const sel = i === menuSel;
    if (sel) {
      ctx.fillStyle = 'rgba(0,155,58,0.55)';
      rrect(r.x, r.y, r.w, r.h, 9); ctx.fill();
      ctx.strokeStyle = '#FFD700'; ctx.lineWidth = 3;
    } else {
      ctx.strokeStyle = 'rgba(154,176,200,0.55)'; ctx.lineWidth = 2;
    }
    rrect(r.x, r.y, r.w, r.h, 9); ctx.stroke();
    ctx.font = 'bold 18px Arial, sans-serif';
    ctx.fillStyle = sel ? '#FFFFFF' : '#9AB0C8';
    ctx.textAlign = 'center';
    ctx.fillText(m.label(), r.x + r.w / 2, r.y + r.h / 2);
    if (sel) { // BACKCOURT-orange selection carets
      ctx.fillStyle = '#EE6723';
      ctx.font = 'bold 18px "Courier New", monospace';
      const blink = Math.floor(tGlobal * 3) % 2 ? '>' : '»';
      ctx.textAlign = 'right'; ctx.fillText(blink, r.x - 8, r.y + r.h / 2);
      ctx.textAlign = 'left'; ctx.fillText(blink === '>' ? '<' : '«', r.x + r.w + 8, r.y + r.h / 2);
    }
  });
  ctx.textAlign = 'center';
  ctx.font = '12px "Courier New", monospace';
  ctx.fillStyle = '#9AB0C8';
  const touchOn = getComputedStyle(touchPanel).display !== 'none';

  ctx.font = '14px "Courier New", monospace';
  ctx.fillStyle = '#9AB0C8';

}

function renderWin() {
  ctx.fillStyle = 'rgba(10,22,40,0.92)';
  ctx.fillRect(0, 0, W, H);
  const team = TEAMS[winner];
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = 'bold 40px Arial, sans-serif';
  ctx.fillStyle = team.accent;
  ctx.fillText(team.full + ' WINS!', CX, 96);

  ctx.fillStyle = '#FFFFFF';
  ctx.fillText(scores[0] + '  –  ' + scores[1], CX, 142);

    ctx.font = '14px "Courier New", monospace';
    ctx.fillStyle = '#FF8C00';

  }

    ctx.lineWidth = 3;
    ctx.strokeStyle = team.accent;
    ctx.stroke();
    ctx.font = 'bold 18px Arial, sans-serif';

    ctx.fillText('PLAY AGAIN', CX, b.y + b.h / 2);
    ctx.font = '13px "Courier New", monospace';
    ctx.fillStyle = '#9AB0C8';

  }

  // run over: arcade initials entry for the session total
  ctx.font = 'bold 18px Arial, sans-serif';
  ctx.fillStyle = '#FFFFFF';
  ctx.fillText('RUN OVER — ' + myFinalScore + ' PTS — ENTER YOUR INITIALS', CX, 216);
  const v = iniInput.value;
  for (let i = 0; i < 3; i++) {
    const sx = CX - 78 + i * 56, sy = 246, sw = 46, sh = 56;
    ctx.strokeStyle = i === v.length ? '#00C2DD' : 'rgba(154,176,200,0.6)';

    rrect(sx, sy, sw, sh, 8);

      ctx.font = 'bold 34px "Courier New", monospace';
      ctx.fillStyle = '#FFD700';
      ctx.fillText(v[i], sx + sw / 2, sy + sh / 2 + 2);

      ctx.font = 'bold 34px "Courier New", monospace';
      ctx.fillStyle = '#00C2DD';
      ctx.fillText('_', sx + sw / 2, sy + sh / 2 + 2);
    }
  }
  ctx.font = '12px "Courier New", monospace';
  ctx.fillStyle = '#9AB0C8';
  const touchOn = getComputedStyle(touchPanel).display !== 'none';
  ctx.fillText(touchOn ? 'tap the boxes to type' : 'type letters • ENTER to post', CX, 326);

  // post / skip buttons
  const g = goRect(), s = skipRect();
  const canPost = /^[A-Z0-9]{1,3}$/.test(v) && !submitting;
  ctx.fillStyle = canPost ? '#009B3A' : 'rgba(0,155,58,0.35)';
  rrect(g.x, g.y, g.w, g.h, 10); ctx.fill();
  ctx.lineWidth = 2.5;
  ctx.strokeStyle = canPost ? '#FFD700' : 'rgba(255,215,0,0.35)';
  ctx.stroke();
  ctx.font = 'bold 16px Arial, sans-serif';
  ctx.fillStyle = '#FFFFFF';
  ctx.fillText(submitting ? 'POSTING…' : 'POST SCORE', g.x + g.w / 2, g.y + g.h / 2);
  ctx.strokeStyle = 'rgba(154,176,200,0.7)';
  ctx.lineWidth = 2;
  rrect(s.x, s.y, s.w, s.h, 10); ctx.stroke();
  ctx.fillStyle = '#9AB0C8';
  ctx.fillText('SKIP', s.x + s.w / 2, s.y + s.h / 2);
  if (!Leaderboard.isLive) {
    ctx.font = '11px "Courier New", monospace';
    ctx.fillText('demo board — Supabase not configured yet', CX, 430);
  }
}

function renderBoard() {
  renderStripes();
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = 'bold 34px Arial, sans-serif';
  ctx.fillStyle = '#FFD700';
  ctx.fillText('LEADERBOARD', CX, 76);

  ctx.font = 'bold 16px "Courier New", monospace';
  if (!boardData) {
    ctx.fillStyle = '#9AB0C8';
    ctx.fillText('LOADING…', CX, 240);
  } else if (boardData.error) {
    ctx.fillStyle = '#FF5050';
    ctx.fillText("couldn't reach the board", CX, 240);
  } else if (boardData.rows.length === 0) {
    ctx.fillStyle = '#9AB0C8';
    ctx.fillText('no scores yet — be the first!', CX, 240);
  } else {
    boardData.rows.forEach((r, i) => {
      const y = 116 + i * 26;
      const mine = myEntry && r.id === myEntry.id;
      if (i === 0) { // flame highlight on #1
        const fg = ctx.createLinearGradient(CX - 170, y, CX + 170, y);
        fg.addColorStop(0, 'rgba(255,60,0,0)');
        fg.addColorStop(0.5, 'rgba(255,120,0,0.3)');
        fg.addColorStop(1, 'rgba(255,60,0,0)');
        ctx.fillStyle = fg;
        ctx.fillRect(CX - 170, y - 12, 340, 24);
      }
      if (mine) { // aqua highlight on the player's own row
        ctx.fillStyle = 'rgba(0,194,221,0.18)';
        ctx.fillRect(CX - 170, y - 12, 340, 24);
        ctx.strokeStyle = 'rgba(0,194,221,0.8)';
        ctx.lineWidth = 1.5;
        ctx.strokeRect(CX - 170, y - 12, 340, 24);
      }
      ctx.fillStyle = i === 0 ? '#FFD700' : mine ? '#7FE3F2' : '#E8EEF6';
      ctx.textAlign = 'right';
      ctx.fillText((i + 1) + '.', CX - 120, y);
      ctx.textAlign = 'left';
      ctx.fillText(r.name, CX - 96, y);
      ctx.textAlign = 'right';
      ctx.fillText(String(r.score), CX + 150, y);
    });
    ctx.textAlign = 'center';
  }

  const b = playAgainRect();
  ctx.fillStyle = '#009B3A';
  rrect(b.x, b.y, b.w, b.h, 10); ctx.fill();
  ctx.lineWidth = 3;
  ctx.strokeStyle = '#FFD700';
  ctx.stroke();
  ctx.font = 'bold 17px Arial, sans-serif';
  ctx.fillStyle = '#FFFFFF';
  ctx.fillText('PLAY', CX, b.y + b.h / 2);
  if (!Leaderboard.isLive) {
    ctx.font = '11px "Courier New", monospace';
    ctx.fillStyle = '#9AB0C8';
    ctx.fillText('demo board — resets on refresh until Supabase is configured', CX, 460);
  }
}

// ============================================================ main loop
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.033, (now - last) / 1000);
  last = now;
  update(dt);
  render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
